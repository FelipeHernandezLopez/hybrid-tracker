<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sub-2 Hyrox">
<meta name="theme-color" content="#0f0e0c">
<title>Sub-2 × Hyrox</title>
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --orange:#F4541D;--accent:#F4541D;--dark:#0f0e0c;--card:#181714;--card2:#1f1c18;
  --border:rgba(255,255,255,0.07);--text:#e8e4dc;--muted:#7a7568;
  --green:#4CAF82;--blue:#4A9EDB;--yellow:#E8B84B;--purple:#9B7FE8;--teal:#3EC9C1;--red:#E85454;--lime:#8BC34A;
  --nav-h:60px;--hdr-h:52px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;font-size:14px;line-height:1.5}

/* HEADER */
.app-header{position:fixed;top:0;left:0;right:0;height:var(--hdr-h);background:var(--dark);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:100}
.app-header h1{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:#fff}
.hdr-date{font-size:11px;color:var(--muted);text-align:right}
.hdr-week{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;color:var(--orange);text-align:right}

/* PANELS */
.panels{position:fixed;top:var(--hdr-h);bottom:var(--nav-h);left:0;right:0;overflow:hidden}
.panel{display:none;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 24px}
.panel.active{display:block}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--card);border-top:1px solid var(--border);display:flex;align-items:stretch;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--muted);cursor:pointer;transition:color .15s;font-family:'DM Sans',sans-serif}
.nav-btn.active{color:var(--orange)}
.nav-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-lbl{font-size:9px;letter-spacing:.8px;text-transform:uppercase;font-weight:500}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.card-row{display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px;gap:8px}
.card-row:last-child{border:none;padding-bottom:0}
.card-row .lbl{color:var(--muted);flex-shrink:0}
.card-row .val{color:var(--text);text-align:right;line-height:1.4}
.card-row .val em{color:var(--orange);font-style:normal}

/* SEC LABEL */
.sec-label{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin:20px 0 10px}
.sec-label:first-child{margin-top:0}

/* STAT TILES */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat-tile{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#fff;letter-spacing:1px;line-height:1}
.stat-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}

/* SESSION BLOCKS */
.sblock{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;position:relative;overflow:hidden}
.sblock::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:10px 10px 0 0}
.sblock.strength::before{background:var(--orange)}
.sblock.run-z2::before{background:var(--green)}
.sblock.run-hard::before{background:var(--yellow)}
.sblock.hyrox::before{background:var(--blue)}
.sblock.swim::before{background:var(--teal)}
.sblock.rest::before{background:var(--muted)}
.sblock.custom::before{background:var(--purple)}
.sblock.soccer::before{background:var(--lime)}
.sblock.done{opacity:.5}
.sblock.done::after{content:'DONE';position:absolute;top:10px;right:10px;font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:1.5px;color:var(--green);border:1px solid var(--green);border-radius:4px;padding:1px 6px}
.sblock-tag{font-size:9px;text-transform:uppercase;letter-spacing:.8px;font-weight:500;margin-bottom:2px}
.strength .sblock-tag{color:var(--orange)}.run-z2 .sblock-tag{color:var(--green)}.run-hard .sblock-tag{color:var(--yellow)}.hyrox .sblock-tag{color:var(--blue)}.swim .sblock-tag{color:var(--teal)}.rest .sblock-tag{color:var(--muted)}.custom .sblock-tag{color:var(--purple)}.soccer .sblock-tag{color:var(--lime)}
.sblock-name{font-size:13px;font-weight:500;color:#fff;margin-bottom:3px}
.sblock-detail{font-size:11px;color:var(--muted);line-height:1.4}
.sblock-dur{font-size:9px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.5px;font-weight:500}
.sblock-actions{display:flex;gap:8px;margin-top:10px}
.btn-log{flex:1;padding:8px;background:rgba(244,84,29,.12);border:1px solid rgba(244,84,29,.3);border-radius:8px;color:var(--orange);font-size:11px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .15s}
.btn-log:active{background:rgba(244,84,29,.22)}
.btn-done{padding:8px 12px;background:rgba(76,175,130,.1);border:1px solid rgba(76,175,130,.25);border-radius:8px;color:var(--green);font-size:11px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;font-family:'DM Sans',sans-serif}

/* ALERTS */
.alert{border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:12px;line-height:1.6}
.alert.green{background:rgba(76,175,130,.08);border:1px solid rgba(76,175,130,.25);color:var(--green)}
.alert.yellow{background:rgba(232,184,75,.08);border:1px solid rgba(232,184,75,.25);color:var(--yellow)}
.alert.red{background:rgba(232,84,84,.08);border:1px solid rgba(232,84,84,.3);color:var(--red)}
.alert.blue{background:rgba(74,158,219,.08);border:1px solid rgba(74,158,219,.25);color:var(--blue)}
.alert-title{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:500;opacity:.7;margin-bottom:3px}

/* PROGRESS BAR */
.pbar-wrap{height:4px;background:var(--border);border-radius:4px;margin-top:5px;overflow:hidden}
.pbar-fill{height:100%;border-radius:4px;transition:width .4s}

/* WATER */
.water-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.water-glasses{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.glass{width:36px;height:44px;background:var(--card2);border:1px solid var(--border);border-radius:4px 4px 8px 8px;cursor:pointer;position:relative;overflow:hidden;transition:border-color .15s}
.glass.filled{border-color:var(--blue)}
.glass.filled::after{content:'';position:absolute;bottom:0;left:0;right:0;height:70%;background:rgba(74,158,219,.35)}
.water-total{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--blue)}

/* SUPPLEMENTS */
.supp-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer}
.supp-item:last-child{border:none}
.supp-check{width:18px;height:18px;border:1.5px solid var(--border);border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.supp-item.done .supp-check{background:var(--green);border-color:var(--green)}
.supp-check-mark{width:10px;height:10px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;display:none}
.supp-item.done .supp-check-mark{display:block}
.supp-name{font-size:12px;color:var(--text);flex:1}
.supp-time{font-size:10px;color:var(--muted)}

/* MACROS */
.macro-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.macro-tile{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.macro-val{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fff}
.macro-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:1px}
.macro-sub{font-size:10px;color:var(--orange)}

/* PLAN GRID */
.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px}
.dhead{text-align:center;font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);padding-bottom:6px;font-weight:500}
.sblock-sm{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:6px 5px;margin-bottom:4px;position:relative;overflow:hidden;min-height:72px;cursor:pointer}
.sblock-sm::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:6px 6px 0 0}
.sblock-sm.strength::before{background:var(--orange)}.sblock-sm.run-z2::before{background:var(--green)}.sblock-sm.run-hard::before{background:var(--yellow)}.sblock-sm.hyrox::before{background:var(--blue)}.sblock-sm.swim::before{background:var(--teal)}.sblock-sm.rest::before{background:var(--muted)}.sblock-sm.custom::before{background:var(--purple)}.sblock-sm.soccer::before{background:var(--lime)}
.sblock-sm.rest{opacity:.4;cursor:default}
.sblock-sm.done-sm{opacity:.45}
.sblock-sm.done-sm::after{content:'✓';position:absolute;bottom:3px;right:4px;font-size:9px;color:var(--green)}
.sm-tag{font-size:7px;text-transform:uppercase;letter-spacing:.5px;font-weight:500;color:var(--muted);margin-bottom:1px}
.sm-name{font-size:9px;font-weight:500;color:#fff;line-height:1.2}
.sm-dur{font-size:8px;color:var(--muted);margin-top:3px}
.today-col .sblock-sm{border-color:rgba(244,84,29,.35)}
.today-col .dhead{color:var(--orange)}

/* WEEK NAV */
.week-nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.wbtn{padding:4px 9px;border-radius:100px;font-size:9px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:none;color:var(--muted);transition:all .15s;font-family:'DM Sans',sans-serif}
.wbtn.active{background:var(--orange);border-color:var(--orange);color:#fff}
.phase-sep{font-size:8px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin:0 2px}
.wstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.wstat{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 8px}
.wstat-val{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#fff;letter-spacing:1px;line-height:1}
.wstat-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.legend-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted)}
.legend-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0}

/* LOG */
.log-recent-item{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:6px}
.log-ri-top{display:flex;justify-content:space-between;align-items:center}
.log-ri-name{font-size:12px;font-weight:500;color:var(--text)}
.log-ri-date{font-size:10px;color:var(--muted)}
.log-ri-metrics{font-size:11px;color:var(--muted);margin-top:3px}
.log-ri-metrics em{color:var(--orange);font-style:normal}

/* CHARTS */
.chart-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.chart-title{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1.5px;color:var(--text);margin-bottom:10px}
.chart-canvas-wrap{position:relative;height:160px}

/* FORMS */
.form-field{margin-bottom:12px}
.form-label{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:500;margin-bottom:5px}
.form-input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:300;padding:10px 12px;outline:none;-webkit-appearance:none;transition:border-color .15s}
.form-input:focus{border-color:rgba(244,84,29,.5)}
.form-input::placeholder{color:var(--muted)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form-select{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:10px 12px;outline:none;-webkit-appearance:none;cursor:pointer}
.hrv-btns{display:flex;gap:8px}
.hrv-btn{flex:1;padding:10px;border-radius:8px;border:1px solid var(--border);background:none;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;color:var(--muted);transition:all .15s}
.hrv-btn.active-green{background:rgba(76,175,130,.15);border-color:var(--green);color:var(--green)}
.hrv-btn.active-orange{background:rgba(232,184,75,.15);border-color:var(--yellow);color:var(--yellow)}
.hrv-btn.active-red{background:rgba(232,84,84,.15);border-color:var(--red);color:var(--red)}

/* BODY TAB */
.injury-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
.injury-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.injury-part{font-size:13px;font-weight:500;color:var(--text)}
.injury-badge{font-size:9px;text-transform:uppercase;letter-spacing:.8px;font-weight:500;padding:2px 7px;border-radius:100px}
.badge-active{background:rgba(232,84,84,.15);color:var(--red);border:1px solid rgba(232,84,84,.3)}
.badge-monitoring{background:rgba(232,184,75,.15);color:var(--yellow);border:1px solid rgba(232,184,75,.3)}
.badge-resolved{background:rgba(76,175,130,.15);color:var(--green);border:1px solid rgba(76,175,130,.3)}
.injury-desc{font-size:11px;color:var(--muted)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;backdrop-filter:blur(2px)}
.modal-bg.open{display:block}
.modal{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:18px 18px 0 0;border-top:1px solid var(--border);z-index:201;max-height:85vh;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column}
.modal.open{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:4px;margin:10px auto 0;flex-shrink:0}
.modal-header{padding:12px 16px 10px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1.5px;color:#fff}
.modal-close{width:28px;height:28px;border-radius:50%;background:var(--card2);border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}
.modal-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px;flex:1}
.modal-footer{padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);flex-shrink:0}
.btn-primary{width:100%;padding:14px;background:var(--orange);border:none;border-radius:10px;color:#fff;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1.5px;cursor:pointer;transition:opacity .15s}
.btn-primary:active{opacity:.85}
.btn-secondary{width:100%;padding:12px;background:none;border:1px solid var(--border);border-radius:10px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;margin-top:8px}

/* STRENGTH FORM */
.set-row{display:grid;grid-template-columns:28px 1fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px}
.set-num{font-size:11px;color:var(--muted);text-align:center;font-weight:500}
.set-input{background:var(--card2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:7px 8px;outline:none;width:100%;-webkit-appearance:none;text-align:center}
.set-input:focus{border-color:rgba(244,84,29,.5)}
.btn-add-set{width:100%;padding:8px;background:none;border:1px dashed var(--border);border-radius:7px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:11px;cursor:pointer;margin-top:4px;margin-bottom:12px}
.exercise-name-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.exercise-name{font-size:12px;font-weight:500;color:var(--text)}
.exercise-hint{font-size:10px;color:var(--muted)}
.sets-header{display:grid;grid-template-columns:28px 1fr 1fr auto;gap:6px;margin-bottom:4px}
.sets-hdr-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:center}
.divider{height:1px;background:var(--border);margin:12px 0}

/* HYROX */
.hyrox-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}
.hyrox-row:last-child{border:none}
.hyrox-name{flex:1;font-size:12px;color:var(--text)}
.hyrox-time-input{width:80px;background:var(--card2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;padding:6px 8px;outline:none;text-align:center}

/* CHIPS */
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--border);border-radius:100px;padding:4px 10px;font-size:10px;font-weight:500;color:var(--muted)}
.chip-dot{width:5px;height:5px;border-radius:50%}
.double-badge{display:inline-block;background:rgba(244,84,29,.12);border:1px solid rgba(244,84,29,.25);border-radius:4px;font-size:8px;color:var(--orange);padding:1px 5px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.pm-badge{display:inline-block;background:rgba(74,158,219,.12);border:1px solid rgba(74,158,219,.25);border-radius:4px;font-size:8px;color:var(--blue);padding:1px 5px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}

/* CONDITION */
.condition-card{border-radius:12px;padding:14px;margin-bottom:12px;position:relative;overflow:hidden}
.condition-card.peak{background:linear-gradient(135deg,rgba(76,175,130,.12) 0%,rgba(15,14,12,.8) 80%);border:1px solid rgba(76,175,130,.3)}
.condition-card.good{background:linear-gradient(135deg,rgba(232,184,75,.10) 0%,rgba(15,14,12,.8) 80%);border:1px solid rgba(232,184,75,.25)}
.condition-card.caution{background:linear-gradient(135deg,rgba(232,184,75,.10) 0%,rgba(15,14,12,.8) 80%);border:1px solid rgba(232,184,75,.25)}
.condition-card.warning{background:linear-gradient(135deg,rgba(232,84,84,.10) 0%,rgba(15,14,12,.8) 80%);border:1px solid rgba(232,84,84,.3)}
.condition-card.unknown{background:var(--card);border:1px solid var(--border)}
.condition-status{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;margin-bottom:4px}
.condition-card.peak .condition-status{color:var(--green)}
.condition-card.good .condition-status{color:var(--yellow)}
.condition-card.caution .condition-status{color:var(--yellow)}
.condition-card.warning .condition-status{color:var(--red)}
.condition-card.unknown .condition-status{color:var(--muted)}
.condition-msg{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:10px}
.condition-sleep-row{display:flex;gap:6px;align-items:center}
.sleep-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.sleep-val{font-family:'Bebas Neue',sans-serif;font-size:24px;color:#fff;min-width:36px}
.sleep-range{-webkit-appearance:none;width:100%;height:4px;background:var(--card2);border-radius:4px;outline:none;cursor:pointer}
.sleep-range::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--orange);cursor:pointer}
.btn-save-sleep{padding:8px 12px;background:var(--orange);border:none;border-radius:8px;color:#fff;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;cursor:pointer;white-space:nowrap}

/* MISC */

function getTodayQuote() {
  const dayNum = Math.floor((new Date() - new Date('2026-05-11')) / 86400000);
  return QUOTES[((dayNum % QUOTES.length) + QUOTES.length) % QUOTES.length];
}

function getHabitsDone(suppDone, doneLogs, bodyLog) {
  const today = todayStr();
  const waterTarget = getDayType ? (getDayType(getTodayInfo()?.weekIdx||0, getTodayInfo()?.dayIdx||0)==='rest'?10:12) : 12;
  const waterCount = parseInt(localStorage.getItem('water_'+today)||'0');
  const pausedSupps = JSON.parse(localStorage.getItem('supps_paused')||'{}');
  const activeSupps = SUPPS.filter(s=>!pausedSupps[s.key]);
  const allSupps = activeSupps.length > 0 && activeSupps.every(s=>suppDone[s.key]);
  const hasSleep = bodyLog?.sleep_score != null || localStorage.getItem('sleep_'+today) !== null;
  const todayInfo = getTodayInfo();
  const hasTraining = doneLogs?.some(l => l.date === today) || false;
  const manual = JSON.parse(localStorage.getItem('habits_manual_'+today)||'{}');
  return {
    training: hasTraining,
    water:    waterCount >= waterTarget,
    supps:    allSupps,
    sleep:    hasSleep,
    read:     !!manual.read,
    meditate: !!manual.meditate,
    stretch:  !!manual.stretch,
    dutch:    !!manual.dutch,
    journal:  !!manual.journal,
    coldsho:  !!manual.coldsho,
  };
}

function toggleHabit(key) {
  const today = todayStr();
  const manual = JSON.parse(localStorage.getItem('habits_manual_'+today)||'{}');
  manual[key] = !manual[key];
  localStorage.setItem('habits_manual_'+today, JSON.stringify(manual));
  updateHabitsUI();
}

}

function buildRaceCountdown() {
  const { hyrox, spain } = getRaceDates();
  const today = new Date(); today.setHours(0,0,0,0);

  function countdownBlock(label, dateStr, color, icon) {
    if (!dateStr) return `
      <div style="flex:1;text-align:center;padding:10px 6px;border-right:1px solid var(--border)">
        <div style="font-size:9px;letter-spacing:1px;color:var(--muted);margin-bottom:4px">${icon} ${label}</div>
        <div style="font-size:12px;color:var(--muted);font-style:italic">Set date →</div>
      </div>`;
    const race = new Date(dateStr); race.setHours(0,0,0,0);
    const days = Math.ceil((race - today) / 86400000);
    if (days < 0) return `

function getHabitStreak(key) {
  let streak = 0;
  const today = new Date(todayStr()+'T12:00:00');
  for (let i = 0; i < 90; i++) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const ds = d.toISOString().slice(0,10);
    const manual = JSON.parse(localStorage.getItem('habits_manual_'+ds)||'{}');
    const wasDone = manual[key];
    if (!wasDone && i > 0) break;
    if (wasDone) streak++;
  }
  return streak;
}

function getHabit21Days(key) {
  const result = [];
  const today = new Date(todayStr()+'T12:00:00');
  for (let i = 20; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const ds = d.toISOString().slice(0,10);
    const manual = JSON.parse(localStorage.getItem('habits_manual_'+ds)||'{}');
    result.push({date:ds, done:!!manual[key]});
  }
  return result;
}

function buildHabitsSection(suppDone, doneLogs, bodyLog) {
  const done = getHabitsDone(suppDone, doneLogs, bodyLog);

  const rings = HABITS.map(h => {
    const isDone = done[h.key];
    const streak = getHabitStreak(h.key);
    const clickAttr = h.auto ? '' : `onclick="toggleHabit('${h.key}')"`;
    const cursor = h.auto ? 'default' : 'pointer';
    return `<div class="habit-ring-wrap" style="display:flex;flex-direction:column;align-items:center;gap:4px;cursor:${cursor}" ${clickAttr}>
      <div class="habit-ring" style="width:44px;height:44px;border-radius:50%;border:2.5px solid ${isDone?'var(--green)':'var(--border)'};background:${isDone?'rgba(76,175,130,0.15)':'transparent'};display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s">${h.icon}</div>
      <div class="habit-lbl" style="font-size:8px;color:${isDone?'var(--green)':'var(--muted)'};text-align:center;letter-spacing:.3px;max-width:40px;line-height:1.2">${h.label}</div>
      <div class="habit-streak" style="font-size:9px;color:var(--orange);font-weight:500;min-height:13px">${streak>0?streak+'d':''}</div>
    </div>`;
  }).join('');

  const completedCount = HABITS.filter(h=>done[h.key]).length;

  return `
  <div class="sec-label" style="margin-top:16px">Daily Habits <span class="habit-count" style="color:var(--muted);font-weight:400;font-size:10px">${completedCount}/${HABITS.length} today</span></div>

    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:4px 0 8px">
      ${rings}
    </div>
    <div style="border-top:1px solid var(--border);padding-top:10px;margin-top:4px">
      ${HABITS.filter(h=>!h.auto).map(h=>`
        <div class="habit-check-row" style="display:flex;align-items:flex-start;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="toggleHabit('${h.key}')">
          <div class="habit-box" style="width:18px;height:18px;border:1.5px solid ${done[h.key]?'var(--green)':'var(--border)'};border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:${done[h.key]?'var(--green)':'transparent'};margin-top:1px">
            ${done[h.key]?'<svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,6 5,9 10,3"/></svg>':''}

          <div style="flex:1">
            <div style="font-size:12px;color:var(--text)">${h.icon} ${h.label}</div>
            <div style="font-size:10px;color:var(--muted);margin-top:1px">${h.desc}</div>
            <div style="font-size:10px;color:var(--muted);margin-top:4px;line-height:1.5;opacity:.8">${h.why}</div>
          </div>
          <div class="habit-row-streak" style="font-size:10px;color:var(--orange);font-weight:500;flex-shrink:0">${getHabitStreak(h.key)>0?getHabitStreak(h.key)+'d 🔥':''}</div>
        </div>`).join('')}
    </div>
    ${buildHabitHeatmap(done)}
  </div>`;
}

function buildHabitHeatmap(done) {
  // Build 21-day grid: rows = habits, columns = days (oldest→today)
  const today = todayStr();
  const days = [];
  for (let i = 20; i >= 0; i--) {
    const d = new Date(today + 'T12:00:00'); d.setDate(d.getDate() - i);
    days.push(d.toISOString().slice(0, 10));
  }
  // Day labels: show date number every 7 days + today
  const dayLabels = days.map((ds, i) => {
    if (i === 20) return '<span style="color:var(--accent)">•</span>';
    if (i % 7 === 0) return `<span>${ds.slice(8)}</span>`;
    return '<span></span>';
  }).join('');

  const rows = HABITS.map(h => {
    const cells = days.map(ds => {
      const manual = safeParseJSON(localStorage.getItem('habits_manual_' + ds)) || {};
      // For auto habits check their specific storage
      let isDone = !!manual[h.key];
      if (!isDone && h.key === 'water') {
        isDone = parseInt(localStorage.getItem('water_' + ds) || '0') >= 10;
      } else if (!isDone && h.key === 'sleep') {
        isDone = !!localStorage.getItem('sleep_' + ds);
      }
      const isToday = ds === today;
      const bg = isDone ? 'var(--green)' : isToday ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.04)';
      const border = isToday ? '1px solid var(--accent)' : '1px solid transparent';
      return `<div style="width:100%;aspect-ratio:1;border-radius:3px;background:${bg};border:${border}"></div>`;
    }).join('');
    return `
      <div style="display:contents">
        <div style="font-size:16px;line-height:1;display:flex;align-items:center">${h.icon}</div>
        ${cells}
      </div>`;
  }).join('');

  return `
    <div style="border-top:1px solid var(--border);padding-top:12px;margin-top:4px">
      <div style="font-size:10px;color:var(--muted);margin-bottom:8px;letter-spacing:.5px">21-DAY HEATMAP</div>
      <div style="display:grid;grid-template-columns:20px repeat(21,1fr);gap:3px;align-items:center">
        <div></div>${dayLabels}
        ${rows}
      </div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:8px;justify-content:flex-end">
        <div style="width:8px;height:8px;border-radius:2px;background:rgba(255,255,255,0.04)"></div>
        <span style="font-size:9px;color:var(--muted)">missed</span>
        <div style="width:8px;height:8px;border-radius:2px;background:var(--green)"></div>
        <span style="font-size:9px;color:var(--muted)">done</span>
      </div>
    </div>`;
}

function updateHabitsUI() {
  const card = document.getElementById('habits-card');
  if (!card) return;
  const suppDone = JSON.parse(localStorage.getItem('supps_'+todayStr())||'{}');
  const done = getHabitsDone(suppDone, null, null);

  // Update rings
  const ringDivs = card.querySelectorAll('.habit-ring-wrap');
  HABITS.forEach((h, i) => {
    const wrap = ringDivs[i];
    if (!wrap) return;
    const isDone = done[h.key];
    const streak = getHabitStreak(h.key);
    const ring = wrap.querySelector('.habit-ring');
    const lbl  = wrap.querySelector('.habit-lbl');
    const streakEl = wrap.querySelector('.habit-streak');
    if (ring) { ring.style.borderColor = isDone ? 'var(--green)' : 'var(--border)'; ring.style.background = isDone ? 'rgba(76,175,130,0.15)' : 'transparent'; }
    if (lbl)  { lbl.style.color = isDone ? 'var(--green)' : 'var(--muted)'; }
    if (streakEl) streakEl.textContent = streak > 0 ? streak+'d' : '';
  });

  // Update checklist rows
  const rows = card.querySelectorAll('.habit-check-row');
  HABITS.filter(h=>!h.auto).forEach((h, i) => {
    const row = rows[i];
    if (!row) return;
    const isDone = done[h.key];
    const streak = getHabitStreak(h.key);
    const box = row.querySelector('.habit-box');
    const streakEl = row.querySelector('.habit-row-streak');
    if (box) { box.style.borderColor = isDone ? 'var(--green)' : 'var(--border)'; box.style.background = isDone ? 'var(--green)' : 'transparent'; box.innerHTML = isDone ? '<svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,6 5,9 10,3"/></svg>' : ''; }
    if (streakEl) streakEl.textContent = streak > 0 ? streak+'d 🔥' : '';
  });

  // Update count label
  const countEl = card.previousElementSibling?.querySelector?.('.habit-count');
  if (countEl) countEl.textContent = `${HABITS.filter(h=>done[h.key]).length}/${HABITS.length} today`;
}

function todayStr() {
  // Local date, not UTC — toISOString() gave the wrong day between midnight and ~2am
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// Maps a date string to its program position, so manually added sessions count in the right week
function planPosForDate(dateStr) {
  const start = new Date(PROGRAM_START+'T00:00:00');
  const d = new Date(dateStr+'T00:00:00');
  const diff = Math.round((d - start) / 86400000);
  if (diff < 0 || diff >= 77) return { w: -1, d: -1 };
  return { w: Math.floor(diff/7), d: diff%7 };
}

function sessionDate(wIdx, dIdx) {
  const start = new Date(PROGRAM_START+'T12:00:00');
  start.setDate(start.getDate() + wIdx*7 + dIdx);
  return start.toISOString().slice(0,10);
}
function isPastSession(wIdx, dIdx) { return sessionDate(wIdx,dIdx) < todayStr(); }
function isFutureSession(wIdx, dIdx) { return sessionDate(wIdx,dIdx) > todayStr(); }

function getTodayInfo() {
  const start = new Date(PROGRAM_START+'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0); start.setHours(0,0,0,0);
  const diff = Math.round((now - start) / 86400000);
  if (diff < 0 || diff >= 77) return null;
  return { weekIdx:Math.floor(diff/7), dayIdx:diff%7, weekNum:Math.floor(diff/7)+1, dayNum:(diff%7)+1 };
}

function getDayType(wIdx, dIdx) {
  // Use resolveSession so swapped sessions affect nutrition targets
  const am = resolveSession(wIdx, dIdx, 'am');
  const pm = resolveSession(wIdx, dIdx, 'pm');
  const hasAm = am && am.t !== 'rest';
  const hasPm = pm && pm.t !== 'rest';
  if (!hasAm && !hasPm) return 'rest';
  return (hasAm && hasPm) ? 'double' : 'single';
}

function typeColor(t) {
  return {'strength':'var(--orange)','run-z2':'var(--green)','run-hard':'var(--yellow)',
    'hyrox':'var(--blue)','swim':'var(--teal)','rest':'var(--muted)','custom':'var(--purple)','soccer':'var(--lime)'}[t]||'var(--muted)';
}

function getExercisesForSession(name) {
  for (const key of Object.keys(EXERCISES)) {
    if (name.startsWith(key)) return EXERCISES[key];
  }
  const n = name.toLowerCase();
  if (n.includes('push')) return EXERCISES['Push A'];
  if (n.includes('pull')) return EXERCISES['Pull A'];
  if (n.includes('leg'))  return EXERCISES['Legs A'];
  return EXERCISES['Push A'];
}

function getPhaseForSession() {
  if (!_logCtx) return 1;
  return PLAN[_logCtx.wIdx]?.ph || 1;
}

function getSetsCount(exIdx, phase) {
  // Main lift (index 0): 4 sets Ph1-2, 3 sets Ph3, 2 sets Ph4
  // Accessories: 3 sets Ph1-2, 2 sets Ph3-4
  if (exIdx === 0) return phase <= 2 ? 4 : phase === 3 ? 3 : 2;
  return phase <= 2 ? 3 : 2;
}

function getCondition(score) {
  if (score === null || score === undefined)
    return { level:'unknown', label:'Log Sleep Score', msg:'Enter your Polar Nightly Recharge score to get today\'s condition.' };
  if (score >= 70) return { level:'peak',    label:'Peak Condition',    msg:'Recovery is excellent. You are primed to perform. Hit every target — your body is ready.' };
  if (score >= 50) return { level:'good',    label:'Good to Train',     msg:'Solid recovery. Proceed as planned. Monitor HR on runs — if Zone 2 drifts above 148bpm, ease off.' };
  if (score >= 30) return { level:'caution', label:'Reduce Intensity',  msg:'Below optimal. Cut intensity 15–20%. Prioritise form over load today.' };
  return             { level:'warning', label:'Rest Recommended', msg:'Recovery is insufficient. Swap hard sessions to Zone 1 or rest. Training hard now creates injury risk, not fitness.' };
}

function showToast(msg, duration=3000) {
  let t = document.getElementById('app-toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'app-toast';
    t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:9999;pointer-events:none;transition:opacity .3s;white-space:nowrap;max-width:90vw;text-align:center';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.opacity = '0', duration);
}

function openModal(title, bodyHTML, cb) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHTML;
  modalSaveCallback = cb || null;
  document.getElementById('modal-bg').classList.add('open');

  const footer = document.getElementById('modal-footer');
  if (footer) footer.style.display = cb ? '' : 'none';
}
function closeModal() {
  document.getElementById('modal-bg').classList.remove('open');
  document.getElementById('main-modal').classList.remove('open');
  modalSaveCallback = null;
  const footer = document.getElementById('modal-footer');
  if (footer) footer.style.display = '';
}

// --- Macro logging ---
function getMacroLog(date) {
  try { return JSON.parse(localStorage.getItem('macros_'+(date||todayStr()))||'null'); } catch(e) { return null; }
}
function saveMacroLog(data) {
  localStorage.setItem('macros_'+todayStr(), JSON.stringify(data));
  sb.from('body_logs').upsert({date:todayStr(), macros:data},{onConflict:'date'}).then(()=>{});
}

function getMacroFeedback(actual, target, dayType) {
  const msgs = [];
  const kcalPct = actual.kcal / target.kcal;
  const proteinDiff = actual.protein - target.protein;
  const carbsDiff = actual.carbs - target.carbs;
  const isTraining = dayType !== 'rest';

  // Calories
  if (kcalPct < 0.75) {
    msgs.push({color:'var(--red)', icon:'⚠️', text:`You're significantly under-fuelled (${actual.kcal} vs ${target.kcal} kcal). Cortisol spikes, muscle breaks down, and your next session will suffer. Eat more — especially carbs.`});
  } else if (kcalPct < 0.88) {
    msgs.push({color:'var(--yellow)', icon:'⚡', text:`Slight calorie deficit. Good for fat loss, but if you have a hard session tomorrow, add a carb-rich snack tonight.`});
  } else if (kcalPct >= 0.88 && kcalPct <= 1.12) {
    msgs.push({color:'var(--green)', icon:'✅', text:`Calories on point. You're fuelling performance while creating the deficit to lean out.`});
  } else if (kcalPct > 1.12 && kcalPct <= 1.25) {
    msgs.push({color:'var(--yellow)', icon:'📈', text:`Slightly over target (+${actual.kcal - target.kcal} kcal). Small surplus — won't derail you if it's a training day, but keep it tighter on rest days.`});
  } else if (kcalPct > 1.25) {
    msgs.push({color:'var(--orange)', icon:'🚨', text:`Surplus too high (+${actual.kcal - target.kcal} kcal over target). This slows fat loss without extra performance benefit. Reduce portions tomorrow — especially fats and refined carbs.`});
  }

  // Protein
  if (proteinDiff < -30) {
    msgs.push({color:'var(--red)', icon:'💪', text:`Protein too low (${actual.protein}g vs ${target.protein}g target). Below muscle protection threshold — you risk losing lean mass. Prioritise a protein source at every meal.`});
  } else if (proteinDiff < -15) {
    msgs.push({color:'var(--yellow)', icon:'💪', text:`Protein slightly low. Add a casein shake tonight or an extra chicken breast.`});
  } else if (proteinDiff >= -15 && proteinDiff <= 20) {
    msgs.push({color:'var(--green)', icon:'💪', text:`Protein nailed — muscle is protected and recovery is supported.`});
  } else if (proteinDiff > 20) {
    msgs.push({color:'var(--yellow)', icon:'💪', text:`Protein over target (+${proteinDiff}g). Extra protein won't hurt performance, but the excess calories could slow fat loss. Balance it by reducing fats slightly.`});
  }

  // Carbs
  if (isTraining && actual.carbs < target.carbs * 0.7) {
    msgs.push({color:'var(--red)', icon:'🏃', text:`Carbs too low for a training day (${actual.carbs}g vs ${target.carbs}g). Carbs are your performance fuel — without them your runs feel harder, lifts weaker, recovery slower.`});
  } else if (isTraining && actual.carbs > target.carbs * 1.3) {
    msgs.push({color:'var(--yellow)', icon:'🏃', text:`Carbs above target on a training day (+${actual.carbs - target.carbs}g). Not a problem if your session was intense — but if it was light, cut back tomorrow.`});
  } else if (!isTraining && actual.carbs > target.carbs * 1.3) {
    msgs.push({color:'var(--orange)', icon:'🏃', text:`Carbs high for a rest day (+${actual.carbs - target.carbs}g over). Rest days are your best fat-burning window — lower carbs drive the deficit. Save the carbs for training days.`});
  }

  // Fat
  const fatDiff = actual.fat - target.fat;
  if (fatDiff > 25) {
    msgs.push({color:'var(--orange)', icon:'🧈', text:`Fat significantly over target (+${fatDiff}g). Fat is 9 kcal/g so this adds up fast. Check sauces, oils, and nuts — small amounts have big calorie impact.`});
  } else if (fatDiff > 10) {
    msgs.push({color:'var(--yellow)', icon:'🧈', text:`Fat slightly over target (+${fatDiff}g). Small excess — manageable, but worth watching over the week.`});
  }

  return msgs;
}

function saveMacroModal() {

// --- Swap system ---
// Overrides store actual session content per slot key, not pointers.
// This allows unlimited chained moves without corruption.
// Format: { "wIdx-dIdx-slot": sessionObject | null }
//   sessionObject = the session data to show at this slot
//   null = slot was emptied (session moved to a previously empty slot)
//   key absent = use PLAN default
function getSwaps() { try { return JSON.parse(localStorage.getItem('session_overrides')||'{}'); } catch(e) { return {}; } }

let _swapSyncTimer = null;
function saveSwaps(s) {
  localStorage.setItem('session_overrides', JSON.stringify(s));
  // Sync to Supabase (debounced) so swaps survive cleared browser data and sync across devices
  clearTimeout(_swapSyncTimer);
  _swapSyncTimer = setTimeout(async () => {
    try {
      await sb.from('app_state').upsert({ key:'session_overrides', value:s, updated_at:new Date().toISOString() });
    } catch(e) { /* offline or table not created yet — localStorage still has it */ }
  }, 800);
}

// Pull cloud state on boot — cloud wins over local (it has the latest from any device)
async function loadCloudState() {
  try {
    const { data } = await sb.from('app_state').select('key,value').eq('key','session_overrides').maybeSingle();
    if (data?.value) localStorage.setItem('session_overrides', JSON.stringify(data.value));
  } catch(e) { /* offline or table missing — fall back to localStorage */ }
}
function swapKey(wIdx,dIdx,slot) { return `${wIdx}-${dIdx}-${slot}`; }

function resolveSession(wIdx, dIdx, slot) {
  const overrides = getSwaps();
  const key = swapKey(wIdx, dIdx, slot);
  if (key in overrides) return overrides[key]; // null means empty/moved-out
  return slot==='pm' ? PLAN[wIdx]?.days[dIdx]?.pm : PLAN[wIdx]?.days[dIdx]?.am;
}

function isMovedOut(wIdx, dIdx, slot) {
  const overrides = getSwaps();
  const key = swapKey(wIdx, dIdx, slot);
  // Moved out = key exists in overrides AND value is null (emptied)
  return key in overrides && overrides[key] === null;
}

// With content-based overrides, log at display position directly
function resolveLogContext(wIdx, dIdx, slot) {
  return [wIdx, dIdx, slot];
}

function openMoveModal(wIdx, dIdx, slot) {
  const s = resolveSession(wIdx, dIdx, slot);
  if (!s) return;
  const today = getTodayInfo();
  const todayAbs = today ? today.weekIdx*7 + today.dayIdx : 0;
  const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const slotColors = { 'am':'var(--yellow)', 'pm':'var(--blue)' };

  let rows = '';
  PLAN.forEach((week, wi) => {
    week.days.forEach((day, di) => {
      const abs = wi*7+di;
      if (abs < todayAbs) return; // skip past
      if (wi===wIdx && di===dIdx && slot==='am') return; // skip same cell for am
      const dateStr = sessionDate(wi, di);

      // Offer both AM and PM slots at each future day (except same cell)
      ['am','pm'].forEach(targetSlot => {
        if (wi===wIdx && di===dIdx && targetSlot===slot) return; // skip exact same slot
        const existing = resolveSession(wi, di, targetSlot);
        const existingName = existing && existing.t !== 'rest' ? existing.n : null;
        const slotBadge = `<span style="font-size:8px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:${slotColors[targetSlot]};background:rgba(255,255,255,.06);border-radius:3px;padding:1px 5px">${targetSlot.toUpperCase()}</span>`;
        const targetDesc = existingName
          ? `<span style="font-size:11px;color:var(--muted)">↔ swap with ${existingName}</span>`
          : `<span style="font-size:11px;color:var(--green)">Empty slot</span>`;

        rows += `<div onclick="confirmSwap(${wIdx},${dIdx},'${slot}',${wi},${di},'${targetSlot}')" style="padding:9px 10px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;active-bg:var(--card2)">
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">
              <span style="font-size:12px;color:var(--text);font-weight:600">W${wi+1} ${dayNames[di]}</span>
              ${slotBadge}
              <span style="font-size:10px;color:var(--muted)">${dateStr}</span>
            </div>
            ${targetDesc}
          </div>
          <span style="color:var(--orange);font-size:16px;flex-shrink:0">→</span>
        </div>`;
      });
    });
  });

  openModal(`Move · ${s.n}`, `
    <div style="font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.5">Choose any future day and slot. Sessions will swap if the target is occupied.</div>
    <div style="background:var(--card2);border:1px solid var(--border);border-radius:10px;overflow:hidden;max-height:360px;overflow-y:auto">${rows}</div>
  `, null);

  window._moveCtx = {wIdx, dIdx, slot};
}

function confirmSwap(fromW, fromD, fromSlot, toW, toD, toSlot) {
  const tSlot = toSlot || fromSlot;
  const overrides = getSwaps();
  const fromK = swapKey(fromW, fromD, fromSlot);
  const toK   = swapKey(toW, toD, tSlot);

  // Read current content at both slots (what the user actually sees)
  const fromSession = resolveSession(fromW, fromD, fromSlot);
  const toSession   = resolveSession(toW, toD, tSlot);

  // Swap content: put fromSession at toSlot, toSession (or null) at fromSlot
  overrides[toK]   = fromSession;   // move the dragged session to target
  overrides[fromK] = toSession;     // move target's content back (null = empty)

  // Clean up: if an override now matches the PLAN default exactly, remove it to keep storage clean
  const planFrom = fromSlot==='pm' ? PLAN[fromW]?.days[fromD]?.pm : PLAN[fromW]?.days[fromD]?.am;
  const planTo   = tSlot==='pm'   ? PLAN[toW]?.days[toD]?.pm    : PLAN[toW]?.days[toD]?.am;
  if (overrides[fromK] !== null && JSON.stringify(overrides[fromK]) === JSON.stringify(planFrom)) delete overrides[fromK];
  if (overrides[toK]   !== null && JSON.stringify(overrides[toK])   === JSON.stringify(planTo))   delete overrides[toK];

  saveSwaps(overrides);
  closeModal();
  if (activePanel==='today') renderToday();
  if (activePanel==='plan')  renderPlan();
}

function undoSwap(wIdx, dIdx, slot) {
  // Undo: restore this slot to its PLAN default by removing the override
  const overrides = getSwaps();
  const key = swapKey(wIdx, dIdx, slot);
  delete overrides[key];
  saveSwaps(overrides);
  if (activePanel==='today') renderToday();
  if (activePanel==='plan')  renderPlan();
}

// Reset ALL moves — restores plan to original state
function resetAllSwaps() {
  if (!confirm('Reset all session moves and restore the original plan?')) return;
  localStorage.removeItem('session_overrides');
  localStorage.removeItem('session_swaps'); // also clear old format if present
  // Clear the cloud copy too, or it would restore the swaps on next app start
  sb.from('app_state').upsert({ key:'session_overrides', value:{}, updated_at:new Date().toISOString() }).then(()=>{},()=>{});
  if (activePanel==='today') renderToday();
  if (activePanel==='plan')  renderPlan();
}

function buildSessionCard(s, wIdx, dIdx, slot, done, isDouble) {
  // Resolve what's actually at this slot (swap-aware)
  const resolved = resolveSession(wIdx, dIdx, slot);

  // Nothing here — original was moved out with nothing moved in
  if (resolved === null) {
    return `<div class="sblock rest" style="opacity:.5;border-style:dashed">
      <div class="sblock-tag" style="color:var(--muted)">Moved</div>
      <div class="sblock-name" style="color:var(--muted)">${s?.n||''}</div>
      <div class="sblock-detail" style="font-size:10px">This session was moved to another day</div>
      <div class="sblock-actions"><button class="btn-done" style="background:var(--card2)" onclick="undoSwap(${wIdx},${dIdx},'${slot}')">Undo Move</button></div>
    </div>`;
  }

  if (resolved.t==='rest') return `<div class="sblock rest"><div class="sblock-tag">Rest</div><div class="sblock-name">${resolved.n}</div><div class="sblock-detail">${resolved.d}</div></div>`;

  // Log button must point to the original PLAN position of the resolved session
  const [logW, logD, logS] = resolveLogContext(wIdx, dIdx, slot);
  const badge = isDouble&&slot==='am' ? '<span class="double-badge">AM</span> ' : isDouble&&slot==='pm' ? '<span class="pm-badge">PM</span> ' : '';
  const isFuture = isFutureSession(wIdx, dIdx);
  const isToday  = sessionDate(wIdx, dIdx) === todayStr();
  const canMove  = (isFuture || isToday) && !done;
  return `
    <div class="sblock ${resolved.t} ${done?'done':''}">
      ${badge}<div class="sblock-tag">${resolved.t.replace('-',' ')}</div>
      <div class="sblock-name">${resolved.n}</div>
      <div class="sblock-detail">${resolved.d}</div>
      ${resolved.dur?`<div class="sblock-dur">${resolved.dur}</div>`:''}
      <div class="sblock-actions">
        <button class="btn-log" onclick="openLogModal(${logW},${logD},'${logS}','${sessionDate(wIdx,dIdx)}')">${done?'✓ Edit Log':'Save Session'}</button>
        ${canMove?`<button class="btn-done" style="background:var(--card2);color:var(--blue)" onclick="openMoveModal(${wIdx},${dIdx},'${slot}')">↔ Move</button>`:''}
      </div>
    </div>`;
}

async function saveSleepScore(val) {
  localStorage.setItem('sleep_'+todayStr(), val);
  if (!sb) { renderToday(); return; }
  try {
    const { data: existing, error: selErr } = await sb.from('body_logs').select('id,sleep_score').eq('date',todayStr()).limit(1);
    if (selErr) { showToast('Sleep save failed: ' + selErr.message); console.error('saveSleepScore select:', selErr); renderToday(); return; }
    let saveErr;
    if (existing?.[0]) {
      const { error } = await sb.from('body_logs').update({sleep_score:parseInt(val)}).eq('id',existing[0].id);
      saveErr = error;
    } else {
      const { error } = await sb.from('body_logs').insert({date:todayStr(),sleep_score:parseInt(val)});
      saveErr = error;
    }
    if (saveErr) { showToast('Sleep save failed: ' + saveErr.message); console.error('saveSleepScore write:', saveErr); }
  } catch(e) { showToast('Sleep save error'); console.error('saveSleepScore:', e); }
  renderToday();
}

async function markDone(wIdx, dIdx, slot) {
  const week = PLAN[wIdx]; const s = slot==='pm' ? week.days[dIdx].pm : week.days[dIdx].am;
  if (!s) return;
  const sDate = sessionDate(wIdx, dIdx);
  if (isPastSession(wIdx, dIdx)) {
    if (!confirm(`This session was on ${sDate}. Mark it as done in your historical log?`)) return;
  }
  await sb.from('session_logs').insert({date:sDate,week_idx:wIdx,day_idx:dIdx,slot,type:s.t,name:s.n,data:{completed:true}});
  if (activePanel==='today') renderToday();
  if (activePanel==='plan') renderPlan();
}

function logWater(count) {
  localStorage.setItem('water_'+todayStr(), count);
  const card = document.querySelector('.water-card');
  if (!card) return;
  const target = parseInt(card.dataset.target || 12);
  const totalEl = card.querySelector('.water-total');
  if (totalEl) totalEl.textContent = (count*250) + ' ml';
  card.querySelectorAll('.glass').forEach((g,i) => {
    g.classList.toggle('filled', i < count);
    g.onclick = () => logWater(i < count ? i : i+1);
  });
  const pbar = card.querySelector('.water-pbar');
  if (pbar) pbar.style.width = Math.min(100, count/target*100) + '%';
  // Save to Supabase silently
  sb.from('body_logs').upsert({date:todayStr(), water_glasses:count},{onConflict:'date'}).then(()=>{});
}

function openPresetSession(sessionName) {
  // Close the add session modal and open the full strength log modal for this preset
  closeModal();
  // Create a fake session object matching the EXERCISES keys
  const fakeSession = { t: 'strength', n: sessionName, d: '', dur: '' };
  _logCtx = { wIdx: -1, dIdx: -1, slot: 'custom', session: fakeSession, date: todayStr(), isPast: false };
  _extraExCount = 0;
  const form = buildStrengthForm(fakeSession);
  openModal('Log · ' + sessionName, form, savePresetSession);
}

async function savePresetSession() {
  if (!_logCtx) { closeModal(); return; }
  const s = _logCtx.session;
  const exList = getExercisesForSession(s.n);
  const collectExBlock = (ei, exName) => {
    const block = document.getElementById('ex-block-'+ei);
    if (block && block.style.display === 'none') return null;
    const c = document.getElementById('sets-'+ei); const count = c ? c.children.length : 0;
    const sets = [];
    for(let si=0;si<count;si++){const r=document.getElementById('reps-'+ei+'-'+si)?.value; const k=document.getElementById('kg-'+ei+'-'+si)?.value; if(r||k)sets.push({reps:parseInt(r)||0,kg:parseFloat(k)||0});}
    return sets.length ? {name:exName, sets} : null;
  };
  const exercises = [
    ...exList.map((ex,ei) => collectExBlock(ei, typeof ex==='object'?ex.name:ex)),
    ...Array.from({length:_extraExCount},(_,i) => {
      const ei = 1000+i;
      const block = document.getElementById('ex-block-'+ei);
      if (!block || block.style.display==='none') return null;
      const nameEl = block.querySelector('.exercise-name');
      return collectExBlock(ei, nameEl?.textContent||'Unknown');
    })
  ].filter(Boolean);
  const data = {
    exercises,
    duration: document.getElementById('f-dur')?.value||'',
    hr: parseInt(document.getElementById('f-hr')?.value)||0,
    notes: document.getElementById('f-notes')?.value||''
  };
  // Attribute to the correct program week/day so it counts in weekly stats and the habit tracker
  const pos = planPosForDate(todayStr());
  const { error } = await sb.from('session_logs').insert({
    date: todayStr(), week_idx: pos.w, day_idx: pos.d, slot:'custom',
    type:'strength', name: s.n, data
  });
  if (error) { showToast('Save failed — check connection'); return; }
  closeModal();
  showToast('✓ ' + s.n + ' saved');
  if (activePanel==='today') renderToday();
  if (activePanel==='plan')  renderPlan();
  if (activePanel==='log')   renderLog();
}

async function openLogModal(wIdx, dIdx, slot, displayDate=null) {
  // wIdx/dIdx/slot = DISPLAY position. resolveSession returns what is actually
  // scheduled there (swap-aware) — reading raw PLAN here was the "wrong training
  // appears in the log modal" bug after a swap.
  const s = resolveSession(wIdx, dIdx, slot);
  if (!s || s.t==='rest') { showToast('Session not found'); return; }
  const sDate = displayDate || sessionDate(wIdx, dIdx);
  const past = sDate < todayStr();
  _logCtx = {wIdx, dIdx, slot, session:s, date:sDate, isPast:past};
  _extraExCount = 0;

  // For strength: pull latest logged weights from Supabase and update USER.lifts
  if (s.t === 'strength') {
    const {data: latestLogs} = await sb.from('session_logs')
      .select('data,created_at').eq('type','strength')
      .order('created_at',{ascending:false}).limit(30);
    if (latestLogs) {
      const seen = {};
      for (const log of latestLogs) {
        for (const ex of log.data?.exercises||[]) {
          if (!seen[ex.name] && ex.sets?.length) {
            const maxKg = Math.max(...ex.sets.map(s=>s.kg||0));
            const lastReps = ex.sets[ex.sets.length-1]?.reps;
            if (maxKg > 0) { seen[ex.name] = true; USER.lifts[ex.name] = {w:maxKg, r:lastReps||5}; }
          }
        }
      }
    }
  }

  let form = s.t==='strength' ? buildStrengthForm(s) : s.t.includes('run') ? buildRunForm(s) : s.t==='hyrox' ? buildHyroxForm(s) : s.t==='swim' ? buildSwimForm(s) : buildRunForm(s);
  const warning = past
    ? `<div class="alert yellow" style="margin-bottom:14px"><div class="alert-title">Past Session</div>Logging for <strong>${sDate}</strong> — this updates your historical record.</div>`
    : '';
  openModal('Log · '+s.n, warning+form, saveLogSession);
}

function showExercisePicker() {
  const picker = document.getElementById('ex-picker');
  if (!picker) return;

  const allEx = [];
  const seen = new Set();
  Object.values(EXERCISES).forEach(arr => arr.forEach(ex => {
    if (!seen.has(ex.name)) { seen.add(ex.name); allEx.push(ex); }
  }));
  picker.innerHTML = allEx.map((ex,i) =>
    `<div onclick="addExerciseBlock('${ex.name.replace(/'/g,"\\'")}',${ex.reps},'${(ex.note||'').replace(/'/g,"\\'")}');document.getElementById('ex-picker').style.display='none'"

async function saveLogSession() {
  if (!_logCtx) { closeModal(); return; }
  const {wIdx,dIdx,slot,session:s} = _logCtx;
  let data = { notes: document.getElementById('f-notes')?.value||'' };

  if (s.t==='strength') {
    // No slice — the form renders ALL exercises, so save ALL of them.
    // The old .slice(0,5) silently discarded everything after the 5th exercise.
    const exList = getExercisesForSession(s.n);
    const collectExBlock = (ei, exName) => {
      const block = document.getElementById('ex-block-'+ei);
      if (block && block.style.display === 'none') return null;
      const c = document.getElementById('sets-'+ei); const count = c ? c.children.length : 0;
      const sets = [];
      for(let si=0;si<count;si++){const r=document.getElementById('reps-'+ei+'-'+si)?.value; const k=document.getElementById('kg-'+ei+'-'+si)?.value; if(r||k)sets.push({reps:parseInt(r)||0,kg:parseFloat(k)||0});}
      return sets.length ? {name:exName, sets} : null;
    };
    data.exercises = [
      ...exList.map((ex,ei) => collectExBlock(ei, typeof ex==='object'?ex.name:ex)),
      ...Array.from({length:_extraExCount},(_,i) => {
        const ei = 1000+i;
        const block = document.getElementById('ex-block-'+ei);
        if (!block || block.style.display==='none') return null;
        const nameEl = block.querySelector('.exercise-name');
        return collectExBlock(ei, nameEl?.textContent||'Unknown');
      })
    ].filter(Boolean);
    data.duration = document.getElementById('f-dur')?.value||'';
    data.hr = parseInt(document.getElementById('f-hr')?.value)||0;
  } else if (s.t==='hyrox') {
    data.totalTime = document.getElementById('f-dur')?.value||'';
    data.stations  = HYROX_STATIONS.map((_,i)=>document.getElementById('hx-'+i)?.value||'');
  } else if (s.t==='swim') {
    data.distance=parseInt(document.getElementById('f-dist')?.value)||0;
    data.duration=document.getElementById('f-dur')?.value||'';
    data.swolf=parseInt(document.getElementById('f-swolf')?.value)||0;
    data.hr=parseInt(document.getElementById('f-hr')?.value)||0;
  } else {
    data.distance=parseFloat(document.getElementById('f-dist')?.value)||0;
    data.duration=document.getElementById('f-dur')?.value||'';
    data.hr=parseInt(document.getElementById('f-hr')?.value)||0;
    data.maxHR=parseInt(document.getElementById('f-maxhr')?.value)||0;
    data.rpe=parseInt(document.getElementById('f-rpe')?.value)||6;
  }

  // Delete any existing log for this plan slot first, then insert fresh
  await sb.from('session_logs').delete().eq('week_idx',wIdx).eq('day_idx',dIdx).eq('slot',slot);
  const { error } = await sb.from('session_logs').insert({date:_logCtx.date||todayStr(),week_idx:wIdx,day_idx:dIdx,slot,type:s.t,name:s.n,data});
  if (error) { showToast('Save failed: ' + (error.message || error.code || JSON.stringify(error))); console.error('saveLogSession:', error); return; }
  closeModal();
  showToast('✓ Session saved');
  if (activePanel==='today') renderToday();
  if (activePanel==='plan')  renderPlan();
  if (activePanel==='log')   renderLog();
  renderPerformance();
}

async function saveAddSession() {
  // Called when user taps Save on the "other" custom section
  const type=document.getElementById('f-custom-type')?.value||'Other';
  const name=document.getElementById('f-custom-name')?.value||type;
  if (!name || name === type) { showToast('Enter a session name'); return; }
  const date = document.getElementById('f-custom-date')?.value || todayStr();
  const pos = planPosForDate(date);
  const { error } = await sb.from('session_logs').insert({date,week_idx:pos.w,day_idx:pos.d,slot:'custom',type:'custom',name,
    data:{customType:type,
      duration:parseInt(document.getElementById('f-dur')?.value)||0,
      distance:parseFloat(document.getElementById('f-custom-dist')?.value)||0,
      hr:parseInt(document.getElementById('f-hr')?.value)||0,
      notes:document.getElementById('f-notes')?.value||''}});
  if (error) { showToast('Save failed — check connection'); return; }
  closeModal();
  showToast('✓ Session saved');
  renderToday();
  if (activePanel==='plan') renderPlan();
  if (activePanel==='log') renderLog();
}

let _recentLogs = [];

async function renderLog() {
  const el = document.getElementById('log-content');
  el.innerHTML = '<div class="loading">Loading…</div>';
  const { data: logs } = await sb.from('session_logs').select('*').order('created_at',{ascending:false}).limit(250);
  if (!logs?.length) { el.innerHTML='<div class="empty-state"><div class="empty-state-title">No Sessions Logged Yet</div><p>Log sessions from the Today or Plan tab.</p></div>'; return; }
  _recentLogs = logs;

  const phColors=['','var(--green)','var(--yellow)','var(--orange)'];
  const phNames =['','Rebuild','Build','Race Block'];

  // Group logs by week_idx
  const byWeek = {};
  logs.forEach((log, idx) => {
    const wk = log.week_idx ?? -1;
    if (!byWeek[wk]) byWeek[wk] = [];
    byWeek[wk].push({log, idx});
  });

  let html = '';
  const weekKeys = Object.keys(byWeek).sort((a,b)=>b-a); // newest first

  weekKeys.forEach(wk => {
    const wIdx = parseInt(wk);
    const week = PLAN[wIdx];
    const entries = byWeek[wk];

    // Week header
    if (week) {
      const ph = week.ph;
      const sessionsDone = entries.length;
      const sessionsPlanned = week.sessions;
      const kmPlanned = week.km;
      html += `
        <div style="margin:14px 0 8px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <div style="font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1.5px;color:var(--text)">${week.lbl}</div>
            <span style="font-size:10px;color:${phColors[ph]};background:rgba(0,0,0,.3);border:1px solid ${phColors[ph]};border-radius:20px;padding:2px 8px">${phNames[ph]}</span>
          </div>
          <div style="display:flex;gap:12px;font-size:10px;color:var(--muted)">
            <span>🏃 ${kmPlanned} km planned</span>
            <span>📋 ${sessionsPlanned} sessions</span>
            <span style="color:${sessionsDone>=sessionsPlanned?'var(--green)':'var(--orange)'}">✓ ${sessionsDone} logged</span>
          </div>
          <div style="height:1px;background:var(--border);margin-top:8px"></div>
        </div>`;
    } else {
      html += `<div class="sec-label" style="margin-top:14px">Other Sessions</div>`;
    }

    // Session items for this week
    entries.forEach(({log, idx}) => {
      const color = typeColor(log.type);
      const sep = (s) => s ? ' · ' : '';
      let metrics = '';
      if (log.type === 'strength') {
        if (log.data?.exercises?.length) metrics += `<em>${log.data.exercises.length} ex</em>`;
        if (log.data?.duration) metrics += `${sep(metrics)}${log.data.duration}`;
        if (log.data?.hr > 0) metrics += `${sep(metrics)}<em>${log.data.hr}bpm</em>`;
      } else {
        if (log.data?.distance) metrics += `<em>${log.data.distance}km</em>`;
        if (log.data?.duration && typeof log.data.duration==='string') metrics += `${sep(metrics)}${log.data.duration}`;
        if (log.data?.hr) metrics += `${sep(metrics)}<em>${log.data.hr}bpm</em>`;
        if (log.data?.totalTime) metrics += `Total: <em>${log.data.totalTime}</em>`;
      }
      if (log.data?.completed && !metrics) metrics = 'Marked done';
      const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
      const dayLabel = log.day_idx != null ? dayNames[log.day_idx] : '';
      html += `<div class="log-recent-item" style="margin-bottom:6px">
        <div class="log-ri-top" onclick="openLogDetail(${idx})" style="cursor:pointer">
          <span class="log-ri-name" style="color:${color}">${log.name}</span>
          <span style="display:flex;align-items:center;gap:6px">
            <span class="log-ri-date" style="color:var(--muted)">${dayLabel} ${log.date?.slice(5)||''}</span>
            <span style="font-size:10px;color:var(--muted)">›</span>
          </span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div class="log-ri-metrics" onclick="openLogDetail(${idx})" style="cursor:pointer;flex:1">${metrics||'Logged'}</div>
          <div style="display:flex;gap:4px;flex-shrink:0;margin-left:8px">
            ${log.week_idx!=null&&log.day_idx!=null&&log.slot&&!log.slot.startsWith('strava-')?`<button onclick="openLogModal(${log.week_idx},${log.day_idx},'${log.slot}','${log.date}')" style="padding:3px 8px;background:rgba(244,84,29,.1);border:1px solid rgba(244,84,29,.2);border-radius:6px;color:var(--orange);font-size:10px;cursor:pointer;font-family:'DM Sans',sans-serif">Edit</button>`:''}
            <button onclick="deleteLog('${log.id}')" style="padding:3px 8px;background:rgba(232,84,84,.1);border:1px solid rgba(232,84,84,.2);border-radius:6px;color:var(--red);font-size:10px;cursor:pointer;font-family:'DM Sans',sans-serif">Delete</button>
          </div>
        </div>
      </div>`;
    });
  });

  el.innerHTML = html + '<div style="height:16px"></div>';
}

async function deleteLog(id) {
  if (!confirm('Delete this session log?')) return;
  await sb.from('session_logs').delete().eq('id', id);
  showToast('Session deleted');
  renderLog();
  renderPerformance();
  renderPlan();
  if (activePanel === 'today') renderToday();
}

function openLogDetail(idx) {
  const log = _recentLogs[idx];
  if (!log) return;
  const color = typeColor(log.type);
  let body = `<div style="margin-bottom:14px">
    <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px">${log.date} · ${log.type.replace('-',' ')}</div>
    ${log.data?.notes?`<div style="font-size:12px;color:var(--muted);margin-top:6px;font-style:italic">"${log.data.notes}"</div>`:''}
  </div>`;

  if (log.data?.exercises?.length) {
    body += log.data.exercises.map(ex=>`
      <div style="margin-bottom:14px">
        <div style="font-size:12px;font-weight:500;color:#fff;margin-bottom:6px">${ex.name}</div>
        ${ex.sets?.length ? `
          <div style="display:grid;grid-template-columns:28px 1fr 1fr;gap:4px;margin-bottom:2px">
            <span style="font-size:9px;color:var(--muted);text-align:center">SET</span>
            <span style="font-size:9px;color:var(--muted);text-align:center">REPS</span>
            <span style="font-size:9px;color:var(--muted);text-align:center">KG</span>
          </div>
          ${ex.sets.map((set,i)=>`
            <div style="display:grid;grid-template-columns:28px 1fr 1fr;gap:4px;padding:4px 0;border-bottom:1px solid var(--border)">
              <span style="font-size:11px;color:var(--muted);text-align:center">${i+1}</span>
              <span style="font-size:12px;color:var(--text);text-align:center">${set.reps||'—'}</span>
              <span style="font-size:12px;color:${color};text-align:center;font-weight:500">${set.kg?set.kg+'kg':'—'}</span>
            </div>`).join('')}` : '<div style="font-size:11px;color:var(--muted)">No sets recorded</div>'}
      </div>`).join('<div class="divider"></div>');

  } else if (log.data?.stations?.length) {
    body += `<div style="font-size:12px;font-weight:500;color:#fff;margin-bottom:8px">Total: <span style="color:${color}">${log.data.totalTime||'—'}</span></div>`;
    body += log.data.stations.map((t,i)=>`
      <div class="card-row"><span class="lbl">${HYROX_STATIONS[i]||'Station '+(i+1)}</span><span class="val" style="color:${color}">${t||'—'}</span></div>`).join('');

  } else {
    if(log.data?.distance) body+=`<div class="card-row"><span class="lbl">Distance</span><span class="val" style="color:${color}">${log.data.distance} km</span></div>`;
    if(log.data?.duration) body+=`<div class="card-row"><span class="lbl">Duration</span><span class="val">${log.data.duration}</span></div>`;
    if(log.data?.hr) body+=`<div class="card-row"><span class="lbl">Avg HR</span><span class="val">${log.data.hr} bpm</span></div>`;
    if(log.data?.maxHR) body+=`<div class="card-row"><span class="lbl">Max HR</span><span class="val">${log.data.maxHR} bpm</span></div>`;
    if(log.data?.rpe) body+=`<div class="card-row"><span class="lbl">Feel</span><span class="val">${log.data.rpe}/10</span></div>`;
    if(log.data?.distance&&log.data?.duration){
      const parts=log.data.duration.split(':').map(Number);
      const secs=parts.length===3?parts[0]*3600+parts[1]*60+parts[2]:parts[0]*60+(parts[1]||0);
      const pace=(secs/log.data.distance/60).toFixed(2);
      body+=`<div class="card-row"><span class="lbl">Avg Pace</span><span class="val" style="color:${color}">${Math.floor(pace)}:${String(Math.round((pace%1)*60)).padStart(2,'0')}/km</span></div>`;
    }
    if(log.data?.swolf) body+=`<div class="card-row"><span class="lbl">SWOLF</span><span class="val">${log.data.swolf}</span></div>`;
    if(log.data?.completed) body+=`<div style="font-size:12px;color:var(--green);margin-top:8px">✓ Marked as done</div>`;
  }

  openModal(log.name, `<div class="card">${body}</div>`, null);
  document.getElementById('modal-footer') && (document.getElementById('modal-footer').style.display='none');
}

async function renderPerformance() {
  const el = document.getElementById('stats-content');
  el.innerHTML = '<div class="loading">Loading…</div>';
  const [{ data: logs }, { data: body }] = await Promise.all([
    sb.from('session_logs').select('*').order('date'),
    sb.from('body_logs').select('*').order('date'),
  ]);
  const info = getTodayInfo();
  const allLogs = logs || [];
  const allBody = body || [];
  const runLogs = allLogs.filter(l => l.type && l.type.includes('run'));
  const totalKm = runLogs.reduce((s, l) => s + (l.data?.distance || 0), 0);
  const doneCt = allLogs.length;

  // Program progress
  const totalWeeks = 11;
  const weeksComplete = info ? info.weekNum - 1 : 0;
  const isPlanned = l => l.slot && l.slot !== 'custom' && !l.slot.startsWith('strava-');
  const plannedLogs = (logs||[]).filter(isPlanned);
  // Sessions scheduled up to today (current week: only up to today's day)
  let scheduledUntilToday = 0;
  if (info) {
    PLAN.forEach((w, wi) => {
      if (wi < info.weekIdx) { scheduledUntilToday += w.sessions; }
      else if (wi === info.weekIdx) {
        w.days.forEach((day, di) => {
          if (di <= info.dayIdx) {
            if (day.am && day.am.t !== 'rest') scheduledUntilToday++;
            if (day.pm && day.pm.t !== 'rest') scheduledUntilToday++;
          }
        });
      }
    });
  }
  const sessionsPlannedTotal = scheduledUntilToday;
  const adherencePct = scheduledUntilToday > 0
    ? Math.min(100, Math.round(plannedLogs.length / scheduledUntilToday * 100))
    : 0;

  // Sessions planned up to today
  const sessionsPlanned = sessionsPlannedTotal;

  // Weekly km data for bar chart
  const weeklyKm = {};
  runLogs.forEach(l => {
    const d = new Date(l.date);
    const wk = getISOWeek(d);
    weeklyKm[wk] = (weeklyKm[wk] || 0) + (l.data?.distance || 0);
  });
  const wkLabels = Object.keys(weeklyKm).sort();
  const wkData = wkLabels.map(k => +weeklyKm[k].toFixed(1));

  // Macro adherence % per day from localStorage
  const macroAdherDays = [];
  const macroAdherPct = [];
  for (let i = 30; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const ds = d.toISOString().slice(0, 10);
    const m = safeParseJSON(localStorage.getItem('macros_' + ds));
    if (!m) continue;
    const dayInfo = getPlanInfoForDate(ds);
    if (!dayInfo) continue;
    const target = NUTRITION[dayInfo.dayType] || NUTRITION.rest;
    const pct = Math.round(m.kcal / target.kcal * 100);
    macroAdherDays.push(ds.slice(5));
    macroAdherPct.push(Math.min(pct, 150));
  }

  // Session type statistics
  const sessionTypes = ['strength','run-z2','run-hard','hyrox','swim','soccer'];
  const typeLabels   = {'strength':'Strength','run-z2':'Zone 2','run-hard':'Hard Run','hyrox':'Hyrox','swim':'Swim','soccer':'Soccer'};
  const typeColors   = {'strength':'var(--orange)','run-z2':'var(--green)','run-hard':'var(--yellow)','hyrox':'var(--blue)','swim':'var(--teal)','soccer':'var(--lime)'};
  const today = todayStr();

  // VIEW 1: Up to today — scheduled sessions due by today vs done by today
  const schToday = {}, doneToday = {};
  sessionTypes.forEach(t => { schToday[t]=0; doneToday[t]=0; });
  PLAN.forEach((w,wi) => {
    if (!info || wi > info.weekIdx) return;
    w.days.forEach((day, di) => {
      const sessDate = sessionDate(wi, di);
      if (sessDate > today) return; // not yet due
      [day.am, day.pm].forEach(s => {
        if (s && s.t && s.t!=='rest' && schToday[s.t]!==undefined) schToday[s.t]++;
      });
    });
  });
  (allLogs||[]).filter(l=>l.slot&&!l.slot.startsWith('strava-')&&l.slot!=='custom'&&l.date<=today).forEach(l => {
    if (l.type && doneToday[l.type]!==undefined) doneToday[l.type]++;
  });

  // VIEW 2: Full plan — all sessions in weeks W1 to current week vs done total
  const schFull = {}, doneFull = {};
  sessionTypes.forEach(t => { schFull[t]=0; doneFull[t]=0; });
  PLAN.forEach((w,wi) => {
    if (!info || wi > info.weekIdx) return;
    w.days.forEach((day) => {
      [day.am, day.pm].forEach(s => {
        if (s && s.t && s.t!=='rest' && schFull[s.t]!==undefined) schFull[s.t]++;
      });
    });
  });
  (allLogs||[]).filter(l=>l.slot&&!l.slot.startsWith('strava-')&&l.slot!=='custom').forEach(l => {
    if (l.type && doneFull[l.type]!==undefined) doneFull[l.type]++;
  });

  // Extra sessions (custom/strava) — shown separately
  const extraLogs = (allLogs||[]).filter(l=>l.slot==='custom'||l.slot?.startsWith('strava-'));
  const extraByType = {};
  extraLogs.forEach(l => { extraByType[l.type||'custom'] = (extraByType[l.type||'custom']||0)+1; });

  const makeRow = (t, done, sch, showFuture=false) => {
    if (sch === 0) return '';
    const remaining = Math.max(0, sch - done);
    const pct = Math.min(100, Math.round(done/sch*100));
    const color = pct>=80?'var(--green)':pct>=50?'var(--yellow)':'var(--red)';
    return `<div style="margin-bottom:9px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
        <span style="font-size:12px;font-weight:600;color:${typeColors[t]}">${typeLabels[t]}</span>
        <span style="font-size:11px;color:var(--muted)">${done}/${sch}${showFuture&&remaining>0?` <span style="color:#7a7568">(${remaining} left)</span>`:''} · <span style="color:${color}">${pct}%</span></span>
      </div>
      <div style="height:4px;background:rgba(255,255,255,0.07);border-radius:3px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:${typeColors[t]};border-radius:3px;transition:width .3s"></div>
      </div>
    </div>`;
  };

  const todayRows = sessionTypes.map(t=>makeRow(t,doneToday[t],schToday[t])).join('');
  const fullRows  = sessionTypes.map(t=>makeRow(t,doneFull[t],schFull[t],true)).join('');
  const extraRow  = Object.keys(extraByType).length>0
    ? Object.entries(extraByType).map(([t,n])=>`<span style="font-size:11px;color:var(--orange);background:rgba(244,84,29,.1);border:1px solid rgba(244,84,29,.2);border-radius:20px;padding:2px 8px">${t==='custom'?'Extra':t} ×${n}</span>`).join(' ')
    : '<span style="font-size:11px;color:var(--muted)">None logged yet</span>';

  el.innerHTML = `
    <div style="position:relative;background:linear-gradient(135deg,#0F0E0C 0%,#1a1714 100%);border:1px solid #2a2520;border-radius:12px;padding:16px;margin-bottom:12px;overflow:hidden;display:flex;align-items:center;gap:14px">
      <div style="flex:1;min-width:0">
        <div style="font-size:10px;letter-spacing:2px;color:#F4541D;font-weight:700;margin-bottom:3px">PERFORMANCE</div>
        <div style="font-size:18px;font-weight:900;color:white;letter-spacing:-.5px">${weeksComplete} <span style="font-size:12px;font-weight:500;color:#7a7568">weeks complete</span></div>
        <div style="font-size:11px;color:#7a7568;margin-top:2px">${plannedLogs.length} of ${scheduledUntilToday} scheduled · ${adherencePct}% done</div>
      </div>
      <svg viewBox="0 0 172 172" width="64" height="64" style="flex-shrink:0;opacity:0.9" aria-hidden="true">
        <circle cx="86" cy="86" r="80" fill="#141210" stroke="#F4541D" stroke-width="2"/>
        <circle cx="86" cy="86" r="72" fill="none" stroke="#F4541D" stroke-width="0.5" opacity="0.35"/>
        <circle cx="10" cy="86" r="0" fill="none"/><circle cx="162" cy="86" r="3" fill="#F4541D" opacity="0.5"/>
        <circle cx="10" cy="86" r="3" fill="#F4541D" opacity="0.5"/>
        <text x="86" y="42" fill="#F4541D" font-family="'Helvetica Neue',Arial,sans-serif" font-size="8" font-weight="700" letter-spacing="4" text-anchor="middle">SUB-2  ×  HYROX</text>
        <text x="86" y="78" fill="white" font-family="'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="900" letter-spacing="-1" text-anchor="middle">19.09</text>
        <line x1="34" y1="85" x2="138" y2="85" stroke="#F4541D" stroke-width="0.8" opacity="0.4"/>
        <text x="86" y="100" fill="white" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="5" text-anchor="middle">FINISH</text>
        <text x="86" y="126" fill="#555550" font-family="'Helvetica Neue',Arial,sans-serif" font-size="7" font-weight="500" letter-spacing="3" text-anchor="middle">HYROX RACE DAY</text>
      </svg>
    </div>
    <div class="sec-label">Program Overview</div>
    <div class="card" style="margin-bottom:14px">
      <div class="stat-grid" style="margin-bottom:10px">
        <div class="stat-tile"><div class="stat-val">${weeksComplete}<span style="font-size:13px;color:#7a7568">/19</span></div><div class="stat-lbl">Weeks Done</div></div>
        <div class="stat-tile"><div class="stat-val">${totalKm.toFixed(0)}<span style="font-size:13px;color:#7a7568">km</span></div><div class="stat-lbl">km Logged</div></div>
        <div class="stat-tile"><div class="stat-val">${plannedLogs.length}<span style="font-size:13px;color:#7a7568">/${sessionsPlanned}</span></div><div class="stat-lbl">Sessions</div></div>

function safeParseJSON(s) { try { return s ? JSON.parse(s) : null; } catch(e) { return null; } }

function getPlanInfoForDate(dateStr) {
  const start = new Date(PROGRAM_START);
  const d = new Date(dateStr);
  const diffDays = Math.floor((d - start) / 86400000);
  if (diffDays < 0) return null;
  const wIdx = Math.floor(diffDays / 7);
  const dIdx = diffDays % 7;
  if (wIdx >= PLAN.length) return null;
  const week = PLAN[wIdx];
  const sessions = week[dIdx] || [];
  const dayType = sessions.length === 2 ? 'double' : sessions.length === 1 ? 'single' : 'rest';
  return { wIdx, dIdx, dayType };
}

function getISOWeek(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
}

function mkLine(id,base,labels,data,color,invertY) {
  const ctx=document.getElementById(id)?.getContext('2d'); if(!ctx)return;
  const empty=!data.length;
  const bgMap={'var(--green)':'rgba(76,175,130,0.08)','var(--orange)':'rgba(244,84,29,0.08)','var(--yellow)':'rgba(232,184,75,0.08)','var(--blue)':'rgba(74,158,219,0.08)'};
  chartInstances[id]=new Chart(ctx,{type:'line',data:{labels:empty?['Log sessions to see data']:labels,datasets:[{data:empty?[0]:data,borderColor:color,backgroundColor:bgMap[color]||'rgba(255,255,255,0.05)',pointBackgroundColor:color,pointRadius:empty?0:3,borderWidth:2,tension:0.3,fill:true}]},options:{...base,scales:{...base.scales,y:{...base.scales.y,reverse:!!invertY}}}});
}
