function connectStrava() {
  const url = `https://www.strava.com/oauth/authorize?client_id=${STRAVA_CFG.clientId}&response_type=code&redirect_uri=${encodeURIComponent(STRAVA_CFG.redirectUri)}&approval_prompt=auto&scope=activity:read_all&state=strava`;
  window.location.href = url;
}

async function handleStravaCallback(code) {
  try {
    const res = await fetch('https://www.strava.com/oauth/token', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({client_id: STRAVA_CFG.clientId, client_secret: STRAVA_CFG.clientSecret, code, grant_type: 'authorization_code'})
    });
    const data = await res.json();
    if (!data.access_token) throw new Error(data.message || 'No token');
    localStorage.setItem('strava_auth', JSON.stringify({access_token: data.access_token, refresh_token: data.refresh_token, expires_at: data.expires_at, athlete_name: data.athlete?.firstname || ''}));
    showToast('Strava connected! Tap Import to sync activities.');
  } catch(e) { showToast('Strava connection failed: ' + e.message); }
}

async function getStravaToken() {
  const stored = safeParseJSON(localStorage.getItem('strava_auth'));
  if (!stored) return null;
  if (stored.expires_at * 1000 > Date.now() + 60000) return stored.access_token;
  try {
    const res = await fetch('https://www.strava.com/oauth/token', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({client_id: STRAVA_CFG.clientId, client_secret: STRAVA_CFG.clientSecret, refresh_token: stored.refresh_token, grant_type: 'refresh_token'})
    });
    const data = await res.json();
    stored.access_token = data.access_token;
    stored.refresh_token = data.refresh_token;
    stored.expires_at = data.expires_at;
    localStorage.setItem('strava_auth', JSON.stringify(stored));
    return data.access_token;
  } catch(e) { return stored.access_token; }
}

async function importStrava() {
  const token = await getStravaToken();
  if (!token) { showToast('Connect Strava first'); return; }
  showToast('Importing Strava activities…');
  try {
    const after = Math.floor(new Date(PROGRAM_START).getTime() / 1000);
    const res = await fetch(`https://www.strava.com/api/v3/athlete/activities?per_page=100&after=${after}`, {
      headers: {'Authorization': `Bearer ${token}`}
    });
    const acts = await res.json();
    if (!Array.isArray(acts)) throw new Error('Bad response from Strava');
    const runs = acts.filter(a => a.type === 'Run' || a.sport_type === 'Run');
    let imported = 0;
    for (const act of runs) {
      const date = act.start_date_local.slice(0, 10);
      const diffDays = Math.floor((new Date(date) - new Date(PROGRAM_START)) / 86400000);
      if (diffDays < 0) continue;
      const wIdx = Math.floor(diffDays / 7);
      const dIdx = diffDays % 7;
      const km = +(act.distance / 1000).toFixed(2);
      const name = act.name.toLowerCase();
      let type = 'run-z2';
      if (km >= 14 || name.includes('long')) type = 'run-long';
      else if (name.includes('tempo') || name.includes('threshold') || name.includes('interval') || name.includes('hard')) type = 'run-hard';
      const secs = act.moving_time;
      const dur = [Math.floor(secs/3600), Math.floor(secs%3600/60), secs%60].map(n=>String(n).padStart(2,'0')).join(':');
      const entry = {
        date, week_idx: wIdx, day_idx: dIdx,
        slot: `strava-${act.id}`,
        type, name: act.name,
        data: {distance: km, duration: dur, elevation: act.total_elevation_gain, avg_hr: act.average_heartrate || null, source: 'strava', strava_id: act.id}
      };
      await sb.from('session_logs').upsert(entry, {onConflict: 'date,slot'});
      imported++;
    }
    showToast(`✓ Imported ${imported} run${imported!==1?'s':''} from Strava`);
    if (activePanel === 'log') renderLog();
  } catch(e) { showToast('Import failed: ' + e.message); }
}

function disconnectStrava() { localStorage.removeItem('strava_auth'); renderBody(); }

    const data = await res.json();
    if (!data.access_token) throw new Error(JSON.stringify(data));
    localStorage.setItem('polar_auth', JSON.stringify({access_token: data.access_token, token_type: data.token_type, x_user_id: data.x_user_id}));
    // Register user (required by Polar Accesslink before first data pull)
    await fetch(`https://www.polaraccesslink.com/v3/users`, {
      method: 'POST',
      headers: {'Authorization': `Bearer ${data.access_token}`, 'Content-Type': 'application/json', 'Accept': 'application/json'},
      body: JSON.stringify({'member-id': String(data.x_user_id)})
    }).catch(() => {}); // 409 = already registered, safe to ignore
    showToast('Polar connected! Tap Import to sync sleep & HRV.');
  } catch(e) { showToast('Polar connection failed: ' + e.message); }
}

async function importPolar() {
  const auth = safeParseJSON(localStorage.getItem('polar_auth'));
  if (!auth?.access_token) { showToast('Connect Polar first'); return; }
  showToast('Importing Polar sleep & HRV data…');
  try {
    const userId = auth.x_user_id;
    const headers = {'Authorization': `Bearer ${auth.access_token}`, 'Accept': 'application/json'};
    const [sleepRes, nrRes] = await Promise.all([
      fetch(`https://www.polaraccesslink.com/v3/users/${userId}/sleep`, {headers}),
      fetch(`https://www.polaraccesslink.com/v3/users/${userId}/nightly-recharge`, {headers})
    ]);
    const sleepData = await sleepRes.json().catch(() => ({}));
    const nrData = await nrRes.json().catch(() => ({}));
    const sleepItems = sleepData?.nights || sleepData?.data || [];
    const nrItems = nrData?.recharges || nrData?.data || [];
    // Index nightly recharge by date
    const nrByDate = {};
    nrItems.forEach(r => { const d = (r.date || r.nightly_recharge_date || '').slice(0, 10); if (d) nrByDate[d] = r; });
    let imported = 0;
    for (const night of sleepItems) {
      const date = (night.date || night.sleep_start_time || '').slice(0, 10);
      if (!date || date < PROGRAM_START) continue;
      const startMs = night.sleep_start_time ? new Date(night.sleep_start_time).getTime() : 0;
      const endMs   = night.sleep_end_time   ? new Date(night.sleep_end_time).getTime()   : 0;
      const sleepHours = startMs && endMs ? +((endMs - startMs) / 3600000).toFixed(1) : null;
      const sleepScore = night.sleep_score ?? null;
      const nr = nrByDate[date];
      const ansCharge = nr?.ans_charge ?? null;
      // Map ANS charge (1–4 scale) to hrv status
      let hrv = null;
      if (ansCharge !== null) hrv = ansCharge >= 3 ? 'green' : ansCharge >= 2 ? 'orange' : 'red';
      const hrv_value = nr?.heart_rate_avg ?? null;
      const entry = {date, sleep_hours: sleepHours, sleep_score: sleepScore, hrv, hrv_value};
      Object.keys(entry).forEach(k => entry[k] === null && delete entry[k]);
      await sb.from('body_logs').upsert({date, ...entry}, {onConflict: 'date'});
      if (sleepScore) localStorage.setItem('sleep_' + date, sleepScore);
      imported++;
    }
    showToast(`✓ Imported ${imported} night${imported!==1?'s':''} from Polar`);
    if (activePanel === 'body') renderBody();
  } catch(e) { showToast('Import failed: ' + e.message); }
}

async function exportAllData() {
  showToast('Building backup…');
  try {

      sb.from('injuries').select('*'),

      app: 'SUB-2 x HYROX',

      body_logs: body.data || [],
      injuries: injuries.data || [],
      session_overrides: getSwaps(),
      race_dates: getRaceDates(),
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type:'application/json' });

  } catch(e) {
    showToast('Export failed — check connection');
  }
}

// Handle OAuth callbacks (Strava / Polar redirect back here with ?code=)
(function handleOAuthCallback() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const state = params.get('state');
  if (!code) return;
  history.replaceState({}, '', window.location.pathname);
  if (state === 'strava') handleStravaCallback(code).then(() => showPanel('body'));
  else if (state === 'polar') handlePolarCallback(code).then(() => showPanel('body'));
})();

async function doLogin() {
  const email = document.getElementById('login-email')?.value?.trim();
  const pass  = document.getElementById('login-pass')?.value;
  if (!email || !pass) return;
  const btn = document.getElementById('login-btn');
  btn.textContent = 'Signing in…'; btn.disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) { showLoginScreen(error.message); return; }
  document.getElementById('login-overlay')?.remove();
  initApp();
}

async function doLogout() {
  if (!confirm('Sign out? You will need your email and password to get back in.')) return;
  try { await sb.auth.signOut(); } catch(e) {}
  location.reload();

(async function authGate() {
  if (!sb) { initApp(); return; } // Supabase failed to load — render from PLAN constant

    const { data: { session } } = await sb.auth.getSession();
    if (session) initApp();
    else showLoginScreen();

// ═══════════════════════════════════════════
//  NOTIFICATIONS — Service Worker + Scheduling
// ═══════════════════════════════════════════

async function initNotifications() {
  if (!('serviceWorker' in navigator) || !('Notification' in window)) return;

  try {
    // Register SW (silently if already registered)
    const reg = await navigator.serviceWorker.register('/sw.js');

    // Ask permission on first load — browser shows native prompt once
    if (Notification.permission === 'default') {
      await Notification.requestPermission();
    }
    if (Notification.permission !== 'granted') return;

    // Wait for the SW to be active
    const sw = await getActiveSW(reg);
    if (!sw) return;

    scheduleNotificationsViaSW(sw);
  } catch (err) {
    console.warn('[Notifications] Setup failed:', err);
  }
}

function getActiveSW(reg) {
  return new Promise(resolve => {
    if (reg.active) { resolve(reg.active); return; }
    const sw = reg.installing || reg.waiting;
    if (!sw) { resolve(null); return; }
    sw.addEventListener('statechange', function handler() {
      if (sw.state === 'activated') {
        sw.removeEventListener('statechange', handler);
        resolve(sw);
      }
    });
  });
}

function scheduleNotificationsViaSW(sw) {
  // Pick today's quote (rotate by day-of-year)
  const dayOfYear = Math.floor((Date.now() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
  const q = QUOTES[dayOfYear % QUOTES.length];

  // Build today's session line from live plan + swaps
  const info = getTodayInfo();
  let sessionLine = 'Rest day — recover, stretch, sleep well.';
  let dayType = 'rest';

  if (info) {
    const am = resolveSession(info.weekIdx, info.dayIdx, 'am');
    const pm = resolveSession(info.weekIdx, info.dayIdx, 'pm');
    const sessions = [];
    if (am && am.t !== 'rest') sessions.push(`${am.n} (${am.dur || ''})`);
    if (pm && pm.t !== 'rest') sessions.push(`${pm.n} (${pm.dur || ''})`);
    if (sessions.length === 2) {
      dayType = 'double';
      sessionLine = sessions.join(' + ');
    } else if (sessions.length === 1) {
      dayType = 'single';
      sessionLine = sessions[0];
    }
    if (info.phase) sessionLine = `${info.phase} · ${sessionLine}`;
  }

  sw.postMessage({
    type: 'SCHEDULE_NOTIFICATIONS',
    quote: q.text,
    author: q.author,
    sessionLine,
    dayType
  });
}
