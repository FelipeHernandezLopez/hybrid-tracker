<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hybrid">
<meta name="theme-color" content="#111214">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<title>Hybrid</title>
<style>
:root{--bg:#111214;--c1:#1B1D1F;--c2:#24272A;--line:rgba(255,255,255,.07);--tx:#F2F3F0;--mu:#7E847A;--mu2:#A3A99F;--lime:#C6F432;--limeInk:#1B2404;--ok:#5FD08A;--warn:#F2B94B;--red:#FF6B5E;--strava:#FC4C02;--nav:62px;--hdr:56px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:400 14px/1.5 Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
a{color:var(--lime)}
.cond{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.3px;text-transform:uppercase}
.hdr{position:fixed;top:0;left:0;right:0;height:calc(var(--hdr) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 18px 0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;z-index:50;border-bottom:1px solid var(--line)}
.logo{font-family:"Barlow Condensed";font-weight:700;font-size:24px;letter-spacing:1px}
.logo i{color:var(--lime);font-style:normal}
.hr{text-align:right;font-size:11px;color:var(--mu);line-height:1.3}
.hr b{display:block;color:var(--lime);font-family:"Barlow Condensed";font-size:15px;letter-spacing:.6px;font-weight:600}
main{position:fixed;top:calc(var(--hdr) + env(safe-area-inset-top));bottom:calc(var(--nav) + env(safe-area-inset-bottom));left:0;right:0}
.panel{display:none;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 34px}
.panel.on{display:block}
nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#0C0D0E;border-top:1px solid var(--line);display:flex;z-index:50}
nav button{flex:1;background:none;border:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase}
nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--lime)}
.card{background:var(--c1);border-radius:16px;padding:15px;margin-bottom:12px}
.sec{font-family:"Barlow Condensed";font-weight:600;font-size:14px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mu);margin:20px 2px 9px;display:flex;justify-content:space-between;align-items:center}
.sec:first-child{margin-top:2px}
.mu{color:var(--mu)}.mu2{color:var(--mu2)}.sm{font-size:12px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--c2);color:var(--mu2)}
.pill.l{background:rgba(198,244,50,.12);color:var(--lime)}
.pill.w{background:rgba(242,185,75,.12);color:var(--warn)}
.datebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.datebar button{width:42px;height:42px;border-radius:14px;border:none;background:var(--c1);font-size:20px}
.datebar .d{text-align:center;font-weight:600}
.datebar .d small{display:block;color:var(--mu);font-weight:500;font-size:11px;letter-spacing:.5px}
.hero{padding:4px 2px 6px}
.hero h1{font-family:"Barlow Condensed";font-weight:700;font-size:38px;line-height:.98;letter-spacing:.2px;text-transform:uppercase;margin:8px 0 6px}
.hero p{color:var(--mu2);font-size:13px}
.ex{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--c1);border-radius:14px;padding:13px 14px;margin-bottom:7px;cursor:pointer}
.ex .n{font-weight:600;font-size:14px}
.ex .s{font-size:12px;color:var(--mu)}
.ex .k{text-align:right;flex-shrink:0}
.ex .k b{display:block;color:var(--lime);font-family:"Barlow Condensed";font-size:20px;font-weight:600;line-height:1}
.ex .k small{font-size:11px;color:var(--mu)}
.wod{background:var(--lime);color:var(--limeInk);border-radius:18px;padding:16px;margin:4px 0 12px}
.wod .t{font-family:"Barlow Condensed";font-weight:700;font-size:26px;line-height:1;text-transform:uppercase}
.wod .f{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;opacity:.75;margin-bottom:6px}
.wod ul{list-style:none;margin-top:10px}
.wod li{padding:6px 0;border-top:1px solid rgba(27,36,4,.15);font-weight:500;font-size:14px}
.wod .note{font-size:12px;margin-top:10px;opacity:.8}
.wod .chips{margin-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:none;background:var(--c2);border-radius:20px;padding:7px 12px;font-size:12px;font-weight:600}
.wod .chip{background:rgba(27,36,4,.12);color:var(--limeInk)}
.list{background:var(--c1);border-radius:14px;padding:4px 14px;margin-bottom:12px}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.li:last-child{border:none}
.li b{font-weight:500;color:var(--mu2);white-space:nowrap}
details.list summary{list-style:none;cursor:pointer;padding:12px 0;display:flex;justify-content:space-between;font-weight:600}
details.list summary::-webkit-details-marker{display:none}
details.list summary span{color:var(--mu);font-weight:500;font-size:12px}
details.list[open] summary{border-bottom:1px solid var(--line)}
.strava{display:flex;align-items:center;gap:12px;background:rgba(95,208,138,.1);border:1px solid rgba(95,208,138,.28);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.strava .ic{width:34px;height:34px;border-radius:10px;background:var(--strava);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px;flex-shrink:0}
.strava b{color:var(--ok)}
.macros{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:6px;margin-top:10px}
.mac{background:var(--c2);border-radius:12px;padding:10px 6px;text-align:center}
.mac b{display:block;font-family:"Barlow Condensed";font-size:24px;font-weight:600;line-height:1}
.mac small{font-size:10px;color:var(--mu);letter-spacing:.6px;text-transform:uppercase}
.mac.k b{color:var(--lime)}
.study{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{border:1px solid var(--line);background:var(--c2);border-radius:14px;padding:12px 8px;text-align:center}
.st .i{font-size:20px}
.st b{display:block;font-size:13px;margin-top:4px}
.st small{display:block;font-size:11px;color:var(--mu)}
.st.ok{background:var(--lime);color:var(--limeInk);border-color:var(--lime)}
.st.ok small{color:var(--limeInk);opacity:.7}
.btn{width:100%;padding:14px;border:none;border-radius:14px;background:var(--lime);color:var(--limeInk);font-weight:700;font-size:14px;letter-spacing:.3px}
.btn2{padding:11px 14px;border:none;border-radius:12px;background:var(--c2);font-size:13px;font-weight:600}
.btn2.s{background:rgba(252,76,2,.15);color:var(--strava)}
.btn2.r{color:var(--red)}
.inp{width:100%;background:var(--c2);border:1px solid transparent;border-radius:12px;color:var(--tx);padding:11px 12px;font-size:15px;outline:none;-webkit-appearance:none;font-family:inherit}
.inp:focus{border-color:rgba(198,244,50,.5)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.fld{margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wk{background:var(--c1);border-radius:16px;padding:13px;margin-bottom:10px;border:1px solid transparent}
.wk.cur{border-color:rgba(198,244,50,.5)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.day{border:none;background:var(--c2);border-radius:10px;padding:7px 0 6px;text-align:center;font-size:10px;font-weight:700;position:relative;color:var(--tx)}
.day small{display:block;font-size:9px;color:var(--mu);font-weight:600;margin-top:1px}
.day.rest{opacity:.4}
.day.today{outline:1.5px solid var(--lime)}
.day.ok{background:rgba(95,208,138,.16)}
.day.ok::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--ok)}
.phase{font-family:"Barlow Condensed";font-size:20px;font-weight:700;text-transform:uppercase;margin:22px 2px 8px;display:flex;align-items:baseline;gap:8px}
.phase small{font-family:Inter;font-size:12px;color:var(--mu);font-weight:500;text-transform:none}
.count{display:flex;gap:10px;margin-bottom:12px}
.count .c{flex:1;background:var(--c1);border-radius:16px;padding:13px}
.count b{display:block;font-family:"Barlow Condensed";font-size:34px;font-weight:700;line-height:1}
.count .c.l b{color:var(--lime)}
.tq{background:var(--c1);border-radius:14px;padding:12px 14px;margin-bottom:7px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:90;display:none}.mbg.on{display:block}
.modal{position:fixed;left:0;right:0;bottom:0;max-height:86vh;background:var(--c1);border-radius:22px 22px 0 0;z-index:91;display:none;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.modal.on{display:flex}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 10px}
.mh b{font-family:"Barlow Condensed";font-size:24px;font-weight:700;text-transform:uppercase;line-height:1}
.mh button{width:32px;height:32px;border-radius:50%;border:none;background:var(--c2);color:var(--mu2);font-size:15px}
.mb{padding:4px 18px 22px;overflow-y:auto}
.mb ol,.mb ul{padding-left:18px}.mb li{margin:7px 0;color:var(--mu2)}
.knee{background:rgba(242,185,75,.1);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2B2F33;color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
</style>
</head>
<body>
<header class="hdr"><div class="logo">HYBRID<i>.</i></div><div class="hr" id="hr"></div></header>
<main>
  <section id="p-hoy" class="panel on"></section>
  <section id="p-plan" class="panel"></section>
  <section id="p-tec" class="panel"></section>
  <section id="p-aj" class="panel"></section>
</main>
<nav>
  <button id="n-hoy" class="on" onclick="show('hoy')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Hoy</button>
  <button id="n-plan" onclick="show('plan')"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</button>
  <button id="n-tec" onclick="show('tec')"><svg viewBox="0 0 24 24"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>Técnica</button>
  <button id="n-aj" onclick="show('aj')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
</nav>
<div class="mbg" id="mbg" onclick="closeModal()"></div>
<div class="modal" id="modal"><div class="mh"><b id="mt"></b><button onclick="closeModal()">✕</button></div><div class="mb" id="mbody"></div></div>
<div id="toast"></div>

<script>
// ═══════════════════════════════════════════
//  CONFIG
//  La app solo GUÍA: qué toca, pesos sugeridos y técnica.
//  Lo hecho llega de Strava. Nada se registra a mano salvo los
//  checks de estudio y los 5RM de las pruebas.
// ═══════════════════════════════════════════
const START = "2026-10-12";            // lunes, semana 1
const PRE = {                           // semana 0 · pruebas
  "2026-10-07": "test_inf", "2026-10-08": "test_sup", "2026-10-09": "futbol",
  "2026-10-10": "run_pre", "2026-10-11": "domingo"
};
// Solo IDs públicos: las claves secretas viven en el Apps Script de la hoja
const STRAVA_ID = "246619";
const POLAR_ID = "8034e007-b5e5-463d-bb19-13dcebc363d8";
const REDIRECT = "https://felipehernandezlopez.github.io/hybrid-tracker/";
const LS = "hybrid_v2";
const DN = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const DF = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const MN = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const PHASE = ["", "Verse bien", "Motor", "Hyrox"];
const PHASE_SUB = ["", "Fuerza + WODs, recomposición", "Volumen de motor y fuerza pesada", "Específico, simulacros y taper"];

const NUT = {
  train: { k: 2600, p: 180, c: 300, f: 75, lbl: "Día de entreno" },
  high:  { k: 2800, p: 180, c: 350, f: 75, lbl: "Fútbol / carrera / tenis" },
  rest:  { k: 2200, p: 180, c: 200, f: 75, lbl: "Descanso" }
};
const STUDY = [
  { k: "read",  i: "📖", n: "Lectura",  min: 20 },
  { k: "dutch", i: "🇳🇱", n: "Holandés", min: 20 },
  { k: "cour",  i: "🎓", n: "Coursera", min: 30 }
];

const DEF = {
  race: "2027-03-21", bw: 86,
  lifts: { squat: 100, trap: 120, bench: 90, ohp: 55, pull: 10 },
  liftsWeek: 0, row2k: "", km1: "", tested: false,
  study: {}, tests: [], body: [], acts: {}, lastSync: 0,
  conn: "", planName: "", strava: false, polar: false, vo2: "", rhr: "", sheetSync: "", pushed: ""
};
let S = load();
let tab = "hoy";
let viewDate = todayS();
let openedOn = todayS();

function load() {
  try { const p = JSON.parse(localStorage.getItem(LS) || "{}"); const o = Object.assign({}, DEF, p); o.lifts = Object.assign({}, DEF.lifts, p.lifts || {}); o.tests = o.tests || []; o.body = o.body || []; return o; }
  catch (e) { return JSON.parse(JSON.stringify(DEF)); }
}
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }

// ═══════════════════════════════════════════
//  TÉCNICA — biblioteca de ejercicios
//  c = indicaciones · k = nota de rodilla
// ═══════════════════════════════════════════
const EX = {
  boxsq:   { n: "Box squat", g: "Fuerza", c: ["Cajón a la altura en que el muslo queda paralelo al suelo.", "Pies algo más abiertos que los hombros, rodillas empujando hacia afuera.", "Siéntate atrás de forma controlada, toca el cajón sin relajarte del todo y sube explosivo.", "Espalda neutra, aire y abdomen apretado antes de bajar."], k: "El cajón limita la profundidad y lleva la carga a cadera y glúteo: es la sentadilla más amable para tus rodillas." },
  trap:    { n: "Peso muerto con trap bar", g: "Fuerza", c: ["Párate en el centro de la barra, agarres a los lados.", "Cadera atrás, pecho arriba, hombros encima de la barra.", "Empuja el suelo con las piernas y termina apretando glúteos sin echarte hacia atrás.", "Baja controlado por el mismo camino."], k: "Más vertical que el convencional, reparte la carga entre cadera y rodilla sin estresarla." },
  rlunge:  { n: "Zancada hacia atrás", g: "Accesorio", c: ["Mancuernas a los lados o sandbag al hombro.", "Paso largo hacia atrás, baja hasta que la rodilla de atrás casi toque.", "El peso en el talón de adelante; sube empujando con esa pierna.", "Torso vertical, rodilla de adelante alineada con el pie."], k: "Hacia atrás frena menos la rodilla que la zancada hacia adelante." },
  nordic:  { n: "Curl nórdico / femoral", g: "Accesorio", c: ["Rodillas en un cojín, tobillos sujetos (compañero o barra baja).", "Cuerpo recto de rodillas a cabeza, déjate caer lento resistiendo con los isquios.", "Cuando no aguantes, frena con las manos y vuelve empujando.", "Alternativa: curl femoral en máquina o con fitball."], k: "Isquios fuertes estabilizan la rodilla en el fútbol." },
  spanish: { n: "Sentadilla española (isométrica)", g: "Rodilla", c: ["Banda gruesa anclada a un poste, detrás de las rodillas.", "Aléjate hasta que tense, baja a media sentadilla con las espinillas verticales.", "Aguanta el tiempo indicado sin dolor.", "Debe sentirse en el cuádriceps, no en la rodilla."], k: "Isométrico para el tendón rotuliano: suele bajar el dolor de rodilla tras unas semanas." },
  calf:    { n: "Elevación de gemelos", g: "Accesorio", c: ["De pie en un escalón con peso.", "Sube en punta, pausa 1 s arriba, baja 3 s hasta estirar.", "Rodilla casi estirada para gemelo; sentado para sóleo."] },
  pallof:  { n: "Pallof press", g: "Core", c: ["Banda o polea a la altura del pecho, de lado al anclaje.", "Empuja las manos al frente y aguanta 2 s sin girar el tronco.", "Glúteos y abdomen apretados."] },
  bench:   { n: "Press de banca", g: "Fuerza", c: ["Ojos bajo la barra, escápulas juntas y abajo, pies firmes.", "Agarre algo más ancho que hombros.", "Baja a la parte baja del pecho con los codos a unos 45°.", "Empuja hacia arriba y un poco hacia atrás."] },
  pullup:  { n: "Dominadas lastradas", g: "Fuerza", c: ["Cinturón con disco o mancuerna entre los pies.", "Empieza colgado con los brazos estirados y las escápulas activas.", "Lleva el pecho a la barra pensando en meter los codos a los bolsillos.", "Baja controlado hasta estirar del todo."] },
  ohp:     { n: "Press militar", g: "Fuerza", c: ["De pie, barra sobre la clavícula, agarre al ancho de hombros.", "Glúteos y abdomen apretados, sin arquear la espalda.", "Empuja recto y mete la cabeza al pasar la barra.", "Bloquea arriba con la barra sobre la mitad del pie."] },
  row:     { n: "Remo con barra", g: "Accesorio", c: ["Bisagra de cadera, torso a unos 45°, espalda neutra.", "Tira la barra al ombligo apretando la espalda.", "Baja controlado sin perder la posición."] },
  dips:    { n: "Fondos en paralelas", g: "Accesorio", c: ["Hombros abajo, lejos de las orejas.", "Baja hasta que el codo quede a 90°, torso algo inclinado.", "Sube hasta bloquear. Lastra cuando hagas más de 12."] },
  facepull:{ n: "Face pull", g: "Accesorio", c: ["Polea o banda a la altura de la cara, agarre con cuerda.", "Tira hacia la frente separando las manos y rota hacia afuera al final.", "Salud de hombro: ligero y con control."] },
  latraise:{ n: "Elevaciones laterales", g: "Accesorio", c: ["Mancuernas ligeras, codo levemente flexionado.", "Sube hasta la altura del hombro guiando con el codo.", "Baja en 3 segundos sin balanceo."] },
  hpc:     { n: "Hang power clean", g: "Potencia", c: ["Barra a mitad del muslo, espalda neutra, hombros por delante.", "Salta: extiende cadera, rodillas y tobillos de golpe.", "Encoge los hombros y mete los codos rápido para recibir en media sentadilla.", "Rápido y técnico, no pesado y lento."] },

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function pad(n) { return String(n).padStart(2, "0"); }
function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function pd(s) { return new Date(s + "T12:00:00"); }
function addD(s, n) { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); }
function diff(a, b) { return Math.round((pd(a) - pd(b)) / 864e5); }
function todayS() { return ymd(new Date()); }
function fdate(s) { const d = pd(s); return d.getDate() + " " + MN[d.getMonth()]; }
function dow(s) { return (pd(s).getDay() + 6) % 7; }
function r25(x) { return Math.round(x / 2.5) * 2.5; }
function toast(m) { const t = $("toast"); t.textContent = m; t.style.opacity = "1"; clearTimeout(t._t); t._t = setTimeout(function () { t.style.opacity = "0"; }, 2600); }
function openModal(title, html) { $("mt").textContent = title; $("mbody").innerHTML = html; $("mbg").classList.add("on"); $("modal").classList.add("on"); }
function closeModal() { $("mbg").classList.remove("on"); $("modal").classList.remove("on"); }

// ═══════════════════════════════════════════
//  ESTRUCTURA DEL CICLO
//  Se recalcula desde START hasta la fecha del Hyrox.
//  Fase 1 = primeras 8 semanas · Fase 3 = últimas 8 · Fase 2 = el medio.
//  Descarga en la 4ª semana de cada bloque; las 2 últimas son taper.
// ═══════════════════════════════════════════
function totalWeeks() { return Math.max(10, Math.floor(diff(S.race, START) / 7) + 1); }
function weekInfo(w) {
  const T = totalWeeks(), p3 = T - 8;
  let ph, l;
  if (w < 8) { ph = 1; l = w; }
  else if (w < p3) { ph = 2; l = w - 8; }
  else { ph = 3; l = w - p3; }
  const taper = w >= T - 2;
  const deload = !taper && l % 4 === 3;
  return { w: w, T: T, ph: ph, l: l, deload: deload, taper: taper, p3: p3 };
}
function posOf(ds) {
  const d = diff(ds, START);
  if (d < 0) return null;
  const w = Math.floor(d / 7);
  if (w >= totalWeeks()) return null;
  return weekInfo(w);
}

// Esquema de series para los básicos: s × r al p % del 5RM
function scheme(wi) {
  if (wi.taper) return { s: 3, r: 3, p: 0.8 };
  if (wi.deload) return { s: 3, r: 5, p: 0.65 };
  const i = wi.l % 4;
  if (wi.ph === 1) return [{ s: 4, r: 8, p: 0.8 }, { s: 4, r: 7, p: 0.85 }, { s: 4, r: 6, p: 0.9 }][i];
  if (wi.ph === 2) return [{ s: 5, r: 5, p: 0.9 }, { s: 5, r: 4, p: 0.95 }, { s: 5, r: 3, p: 1 }][i];
  return [{ s: 4, r: 5, p: 0.85 }, { s: 4, r: 4, p: 0.9 }, { s: 3, r: 3, p: 0.95 }][i];
}
// Cada bloque de 4 semanas terminado sube el 5RM de referencia (+5 kg piernas, +2,5 kg torso), hasta la fase 3
function blocks(wi) { const wEff = Math.min(wi.w, wi.p3); return Math.max(0, Math.floor((wEff - S.liftsWeek) / 4)); }
function kg(key, pct, wi) {
  const base = parseFloat(S.lifts[key]); if (!base && key !== "pull") return null;
  const inc = (key === "squat" || key === "trap") ? 5 : 2.5;
  if (key === "pull") {
    const tot = (S.bw + (base || 0) + inc * blocks(wi)) * pct - S.bw;
    return tot <= 1 ? "PC" : r25(tot);
  }
  return r25((base + inc * blocks(wi)) * pct);
}
function main(ex, key, wi, mult, setsAdj) {
  const sc = scheme(wi); const v = kg(key, sc.p * (mult || 1), wi);
  return { ex: ex, sr: Math.max(2, sc.s + (setsAdj || 0)) + "×" + sc.r, kg: v === "PC" ? "PC" : v, unit: v === "PC" ? "peso corporal" : (key === "pull" ? "kg lastre" : "kg") };
}
function acc(ex, sr, note) { return { ex: ex, sr: sr, note: note }; }

// ═══════════════════════════════════════════
//  SESIÓN DEL DÍA
// ═══════════════════════════════════════════
function sessionFor(ds) {
  if (PRE[ds]) return special(PRE[ds], ds, null);
  const wi = posOf(ds); if (!wi) return null;
  const off = diff(ds, S.race);
  if (off > -7) return raceWeek(off, wi);
  const d = dow(ds), rot = wi.w % 8;
  const light = wi.deload || wi.taper;
  const lightNote = light ? "Semana de descarga: WOD al 70% y sin llegar al fallo." : "";
  // Semana de descarga = semana de pruebas: así se mide el progreso real cada 4 semanas
  if (wi.deload) { if (d === 0) return special("test_inf", ds, wi); if (d === 1) return special("test_sup", ds, wi); if (d === 2) return special("test_motor", ds, wi); }
  if (d === 0) {
    const ph1 = wi.ph === 1;
    return { type: "gym", t: "Fuerza inferior", sub: "+ WOD · 65 min", warm: "inf", cool: "cool", wi: wi, nut: "train",
      str: [main("boxsq", "squat", wi), main("trap", "trap", wi, 1, -1),
        acc("rlunge", light ? "2×8/pierna" : "3×8/pierna", "Mancuernas pesadas, 2 reps en reserva"),
        acc("nordic", light ? "2×6" : "3×6-8", "Lento en la bajada"),
        acc("spanish", "3×45 s", "Siempre: protege la rodilla"),
        acc("calf", "3×12", ph1 ? "Pesado, pausa arriba" : "Pesado"),
        acc("pallof", "3×10/lado", "")],
      wod: Object.assign({}, W_MON[rot], { note: lightNote }) };
  }
  if (d === 1) {
    return { type: "gym", t: "Fuerza superior", sub: "+ WOD · 60 min", warm: "sup", cool: "cool", wi: wi, nut: "train",
      str: [main("bench", "bench", wi), main("pullup", "pull", wi),
        main("ohp", "ohp", wi, wi.ph === 2 ? 0.85 : 0.9, -1),
        acc("row", light ? "2×10" : "3×10", "2 reps en reserva"),
        acc("dips", "3×máx", "Lastra si pasas de 12"),
        acc("facepull", "3×15", "Ligero"), acc("latraise", "3×15", "Lento")],
      wod: Object.assign({}, W_TUE[rot], { note: lightNote }) };
  }
  if (d === 2) {
    return { type: "engine", t: "Motor", sub: "Intervalos + movilidad larga · 60 min", warm: "eng", cool: "long", wi: wi, nut: "train", str: [],
      wod: Object.assign({}, W_WED[rot], { note: (light ? "Descarga: haz 2/3 del volumen. " : "") + paceNote() }) };
  }
  if (d === 3) {
    if (wi.ph === 3) {
      const idx = Math.min(W_HYROX.length - 1, [0, 1, 2, 0, 3, 4][Math.min(5, wi.l)]);
      const deloadWod = { f: "Descarga · técnica de estaciones", it: ["3 rondas suaves:", "500 m ski · 25 m sled push · 25 m sled pull", "500 m remo · 100 m farmer · 20 wall balls"], m: ["ski", "sledpush", "sledpull", "rower", "farmer", "wallball"] };
      return { type: "gym", t: "Hyrox", sub: "Simulación · 75 min", warm: "full", cool: "cool", wi: wi, nut: "train",
        str: (wi.deload || wi.taper) ? [] : [acc("hpc", "4×3", "Rápido, RPE 7")],
        wod: (wi.deload || wi.taper) ? Object.assign({}, deloadWod, wi.taper ? { f: "Taper · estaciones a ritmo de carrera, poco volumen" } : {}) : W_HYROX[idx] };
    }
    const fs = wi.ph === 1 ? main("frontsq", "squat", wi, 0.8, -1) : main("pushpress", "ohp", wi, 1.15, -1);
    return { type: "gym", t: "Full body", sub: "Estilo Hyrox · 70 min", warm: "full", cool: "cool", wi: wi, nut: "train",
      str: [acc("hpc", wi.ph === 1 ? "5×3" : "5×2", "Técnica: rápido, RPE 7 (empieza en ~60 kg)"), fs],
      wod: Object.assign({}, W_THU[rot], { note: lightNote }) };
  }
  if (d === 4) return special("futbol", ds, wi);
  if (d === 5) return special("sat", ds, wi);
  return special("domingo", ds, wi);
}
function paceNote() {
  if (!S.row2k) return "Haz la prueba de 2.000 m de remo para ver tus ritmos.";
  const p = parse2k(S.row2k); if (!p) return "";
  const sp = p / 4;
  return "Tu split del 2k: " + mmss(sp) + " /500 m · +6 s = " + mmss(sp + 6) + " · −2 s = " + mmss(sp - 2);
}

  const x = EX[k];
  openModal(x.n, '<span class="pill l">' + x.g + "</span><ol style=\"margin-top:12px\">" + x.c.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("") + "</ol>" + (x.k ? '<div class="knee">Rodilla: ' + esc(x.k) + "</div>" : "") +
    '<a class="btn2" style="display:block;text-align:center;margin-top:14px;text-decoration:none;color:var(--tx)" href="https://www.youtube.com/results?search_query=' + encodeURIComponent(x.n + " técnica") + '" target="_blank" rel="noopener">Ver vídeos en YouTube</a>');
}

// ═══════════════════════════════════════════
//  PLAN
// ═══════════════════════════════════════════
const SHORT = { gym: "Gym", engine: "Motor", soccer: "Fútbol", run: "Run", rest: "Desc", test: "Test", race: "RACE" };
function shortName(s) { if (!s) return "—"; if (s.t === "Fuerza inferior") return "Pierna"; if (s.t === "Fuerza superior") return "Torso"; if (s.t === "Full body") return "Full"; if (s.t === "Hyrox") return "Hyrox"; if (s.type === "run") return "Run/Ten"; return SHORT[s.type] || s.t; }
function renderPlan() {
  const t = todayS(), T = totalWeeks();
  let done = 0, due = 0;
  for (let d = "2026-10-07"; d <= t && d <= S.race; d = addD(d, 1)) { const s = sessionFor(d); if (s && s.type !== "rest") { due++; if (dayActs(d).length) done++; } }
  let h = '<div class="count"><div class="c l"><b>' + Math.max(0, diff(S.race, t)) + '</b><span class="sm mu">días al Hyrox</span></div><div class="c"><b>' + done + "<span class=\"mu\" style=\"font-size:20px\">/" + due + '</span></b><span class="sm mu">sesiones en Strava</span></div></div>';
  const lastB = S.body.length ? S.body[S.body.length - 1] : null, firstB = S.body.length ? S.body[0] : null;
  h += '<div class="count"><div class="c"><b>' + (S.vo2 || "—") + '</b><span class="sm mu">VO2 max · Polar</span></div><div class="c"><b>' + (lastB ? lastB.kg : "—") + (lastB && firstB && lastB !== firstB ? '<span class="mu" style="font-size:16px"> ' + (lastB.kg - firstB.kg > 0 ? "+" : "") + (Math.round((lastB.kg - firstB.kg) * 10) / 10) + "</span>" : "") + '</b><span class="sm mu">peso kg</span></div></div>';
  // semana 0
  h += '<div class="phase">Semana 0 <small>Pruebas · 7-11 oct</small></div>' + weekHTML("2026-10-05", null, t);
  let lastPh = 0;
  for (let w = 0; w < T; w++) {
    const wi = weekInfo(w);
    if (wi.ph !== lastPh) { lastPh = wi.ph; h += '<div class="phase">Fase ' + wi.ph + " · " + PHASE[wi.ph] + " <small>" + PHASE_SUB[wi.ph] + "</small></div>"; }
    h += weekHTML(addD(START, w * 7), wi, t);
  }
  $("p-plan").innerHTML = h;
  const cur = document.querySelector(".wk.cur"); if (cur) cur.scrollIntoView({ block: "center" });
}
function weekHTML(ws, wi, t) {
  let days = "";
  for (let d = 0; d < 7; d++) {
    const ds = addD(ws, d), s = sessionFor(ds);
    days += '<button class="day ' + (!s || s.type === "rest" ? "rest " : "") + (ds === t ? "today " : "") + (dayActs(ds).length ? "ok" : "") + '" onclick="goto(\'' + ds + '\')">' + DN[d] + "<small>" + shortName(s) + "</small></button>";
  }
  const cur = t >= ws && t <= addD(ws, 6);
  const tag = !wi ? "" : wi.taper ? '<span class="pill w">Taper</span>' : wi.deload ? '<span class="pill w">Descarga</span>' : "";
  return '<div class="wk ' + (cur ? "cur" : "") + '"><div class="row sp"><b>' + (wi ? "Semana " + (wi.w + 1) : "Pruebas") + ' <span class="mu sm" style="font-weight:500">· ' + fdate(ws) + "</span></b>" + tag + '</div><div class="days">' + days + "</div></div>";
}

// ═══════════════════════════════════════════
//  TÉCNICA
// ═══════════════════════════════════════════
function renderTec() {
  const groups = {};
  Object.keys(EX).forEach(function (k) { (groups[EX[k].g] = groups[EX[k].g] || []).push(k); });
  let h = "";
  ["Fuerza", "Potencia", "Accesorio", "Rodilla", "Core", "Hyrox", "Máquina", "WOD"].forEach(function (g) {
    if (!groups[g]) return;
    h += '<div class="sec">' + g + "</div>" + groups[g].map(function (k) { return '<div class="tq" onclick="tech(\'' + k + '\')"><span>' + EX[k].n + '</span><span class="mu">›</span></div>'; }).join("");
  });
  h += '<div class="sec">Movilidad</div>' + Object.keys(MOB).map(function (k) { return mobHTML(k); }).join("");
  $("p-tec").innerHTML = h;
}

// ═══════════════════════════════════════════
//  AJUSTES
// ═══════════════════════════════════════════
function renderAj() {
  const c = connParts();
  let h = '<div class="sec">Hoja de Google</div><div class="card">' +
    (c ? '<div class="row sp"><div><b>Conectada</b><div class="sm mu">' + (S.sheetSync ? "Última sincronización: " + new Date(S.sheetSync).toLocaleString("es") : "Aún sin sincronizar") + '</div></div></div><button class="btn" style="margin-top:12px" onclick="refresh(true)">Sincronizar ahora</button>'
       : '<p class="sm mu" style="margin-bottom:10px">Pega el código de conexión de tu hoja (la URL que termina en ?k=…).</p>') +
    '<div class="fld" style="margin-top:12px"><div class="lbl">Código de conexión</div><input class="inp" id="aj-conn" placeholder="https://script.google.com/…/exec?k=…" value="' + esc(S.conn) + '"></div>' +
    '<button class="btn2" style="width:100%" onclick="saveConn()">Guardar código</button></div>';
  h += '<div class="sec">Fuentes</div><div class="card">' + srcRow("strava", "Strava", "Entrenos: tipo, duración, ritmo, pulso, calorías", S.strava) + '<div style="height:1px;background:var(--line);margin:12px 0"></div>' + srcRow("polar", "Polar", "VO2 max, sueño, recuperación y FC en reposo", S.polar) + "</div>";
  h += '<div class="sec">Mis 5RM</div><div class="card"><p class="sm mu" style="margin-bottom:12px">Se actualizan solos cuando apuntas una prueba. Aquí puedes corregirlos.</p>' +
    '<div class="g2">' + lf("squat", "Box squat") + lf("trap", "Trap bar") + lf("bench", "Banca") + lf("ohp", "Press militar") + lf("pull", "Dominada (lastre)") + '<div class="fld"><div class="lbl">Peso corporal</div><input class="inp" id="lf-bw" inputmode="decimal" value="' + S.bw + '"></div>' +
    '<div class="fld"><div class="lbl">Remo 2k</div><input class="inp" id="lf-row2k" placeholder="7:15" value="' + esc(S.row2k) + '"></div><div class="fld"><div class="lbl">1 km</div><input class="inp" id="lf-km1" placeholder="3:45" value="' + esc(S.km1) + '"></div></div>' +
    '<button class="btn2" style="width:100%" onclick="saveLifts()">Guardar</button></div>';
  h += '<div class="sec">Plan</div><div class="card"><div class="fld"><div class="lbl">Fecha del Hyrox</div><input class="inp" type="date" value="' + S.race + '" onchange="setRace(this.value)"></div>' +
    '<div class="fld"><div class="lbl">Nombre del plan (en la hoja)</div><input class="inp" value="' + esc(planName()) + '" onchange="S.planName=this.value.trim();save();schedPush()"></div><p class="sm mu">' + totalWeeks() + " semanas hasta la carrera.</p></div>";
  h += '<div class="sec">Datos</div><div class="card"><p class="sm mu">Todo queda guardado en tu hoja de Google. En el teléfono solo hay una copia.</p><button class="btn2 r" style="width:100%;margin-top:12px" onclick="resetAll()">Borrar la copia del teléfono</button></div>';
  h += '<p class="sm mu" style="text-align:center;margin-top:10px">Pesos y calorías son orientativos. Si la rodilla duele al bajar escaleras o al día siguiente, consulta con un fisio.</p>';
  $("p-aj").innerHTML = h;
}
function srcRow(k, n, d, on) {
  return '<div class="row sp"><div><b>' + n + '</b> <span class="pill ' + (on ? "l" : "") + '">' + (on ? "Conectado" : "No conectado") + '</span><div class="sm mu" style="margin-top:3px">' + d + '</div></div>' +
    (on ? '<button class="btn2" onclick="disconnect(\'' + k + '\')">Quitar</button>' : '<button class="btn2 ' + (k === "strava" ? "s" : "") + '" onclick="oauthGo(\'' + k + '\')">Conectar</button>') + "</div>";
}
function saveConn() {
  S.conn = ($("aj-conn").value || "").trim(); save();
  if (!connParts()) { toast("El código no parece correcto: debe terminar en ?k=…"); return; }
  toast("Conectando con la hoja…"); pushAll().then(function () { renderAj(); });
}
function lf(k, l) { return '<div class="fld"><div class="lbl">' + l + '</div><input class="inp" id="lf-' + k + '" inputmode="decimal" value="' + (S.lifts[k] == null ? "" : S.lifts[k]) + '"></div>'; }
function saveLifts() {
  LIFT_KEYS.forEach(function (k) { const v = parseFloat(($("lf-" + k).value || "").replace(",", ".")); if (!isNaN(v)) S.lifts[k] = v; });
  const bw = parseFloat(($("lf-bw").value || "").replace(",", ".")); if (bw > 40) S.bw = bw;
  ["row2k", "km1"].forEach(function (k) { const v = ($("lf-" + k).value || "").trim(); if (!v || parse2k(v)) S[k] = v; });
  save(); schedPush(); toast("Guardado: los pesos del plan se actualizaron");
}
function setRace(v) { if (!v || diff(v, START) < 70) { toast("Elige una fecha al menos 10 semanas después del 12 de octubre"); renderAj(); return; } S.race = v; save(); schedPush(); toast("Ciclo ajustado: " + totalWeeks() + " semanas"); renderAj(); updHeader(); }
function resetAll() { if (!confirm("¿Borrar la copia del teléfono? Tu hoja de Google no se toca.")) return; const keep = { race: S.race, conn: S.conn }; S = JSON.parse(JSON.stringify(DEF)); Object.assign(S, keep); save(); refresh(false); render(); }

// ═══════════════════════════════════════════
//  ARRANQUE
// ═══════════════════════════════════════════
(function boot() {
  const q = new URLSearchParams(location.search);
  const code = q.get("code"), st = q.get("state");
  if (code && (st === "strava" || st === "polar")) { history.replaceState(null, "", location.pathname); render(); oauthBack(st, code); }
  else { render(); refresh(false); if (connParts() && S.pushed !== planHash()) schedPush(); }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) return;
    if (openedOn !== todayS()) { openedOn = todayS(); viewDate = todayS(); }
    if (Date.now() - S.lastSync > 10 * 60 * 1000) refresh(false); else render();
  });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>
</body>
</html>
